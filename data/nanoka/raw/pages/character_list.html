			<script type="application/json" data-sveltekit-fetched data-url="https://static.nanoka.cc/hsr/4.6.51/character.json" data-ttl="105">{"status":200,"statusText":"OK","headers":{},"body":"{\n  \"1001\": {\n    \"release\": 1682460000,\n    \"icon\": \"mar7th\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Knight\",\n    \"damageType\": \"Ice\",\n    \"en\": \"March 7th\",\n    \"enhance\": [],\n    \"desc\": \"A girl who once slumbered in eternal ice and knows nothing about her past.\\\\nTo find out the truth about her origins, she decided to travel with the Astral Express.\\\\nAs of right now, she has prepared about \u003Cunbreak>67\u003C/unbreak> different versions of her life story for herself.\",\n    \"ko\": \"Mar. 7th\",\n    \"zh\": \"三月七\",\n    \"ja\": \"{RUBY_B#みつき}三月{RUBY_E#}なのか\"\n  },\n  \"1002\": {\n    \"release\": 1682460000,\n    \"icon\": \"danheng\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Dan Heng\",\n    \"enhance\": [],\n    \"desc\": \"A cold and reserved young man who is reticent about his past.\\\\nTo avoid his kin, he decided to travel with the Astral Express.\",\n    \"ko\": \"단항\",\n    \"zh\": \"丹恒\",\n    \"ja\": \"{RUBY_B#タンコウ}丹恒{RUBY_E#}\"\n  },\n  \"1003\": {\n    \"release\": 1682460000,\n    \"icon\": \"himeko\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Himeko\",\n    \"enhance\": [],\n    \"desc\": \"The one who repaired the Astral Express.\\\\nTo witness the vast starry sky, she decided to travel with the Astral Express.\\\\nHer hobby is brewing hand-made coffee.\",\n    \"ko\": \"히메코\",\n    \"zh\": \"姬子\",\n    \"ja\": \"{RUBY_B#ひめこ}姫子{RUBY_E#}\"\n  },\n  \"1004\": {\n    \"release\": 1682460000,\n    \"icon\": \"welt\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Welt\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A seasoned member of the Express Crew.\\\\nThe passion buried in his heart burns anew as he enjoys this fresh adventure.\\\\nOccasionally, he would sketch the experiences in a notebook.\",\n    \"ko\": \"웰트\",\n    \"zh\": \"瓦尔特\",\n    \"ja\": \"ヴェルト\"\n  },\n  \"1005\": {\n    \"release\": 1689757200,\n    \"icon\": \"kafka\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Kafka\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A member of the Stellaron Hunters. A dashing, collected, and professional beauty.\\\\nUsed the enchantment of Spirit Whisper to set up {NICKNAME} to absorb the Stellaron.\\\\nHer hobby is shopping for and organizing her collection of coats.\",\n    \"ko\": \"카프카\",\n    \"zh\": \"卡芙卡\",\n    \"ja\": \"カフカ\"\n  },\n  \"1006\": {\n    \"release\": 1686128400,\n    \"icon\": \"silverwolf\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Silver Wolf\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A member of the Stellaron Hunters and a genius hacker.\\\\nShe sees the universe as a massive immersive simulation game and has fun with it.\\\\nShe's mastered the skill known as \\\"aether editing,\\\" which can be used to tamper with the data of reality.\",\n    \"ko\": \"은랑\",\n    \"zh\": \"银狼\",\n    \"ja\": \"{RUBY_B#ぎんろう}銀狼{RUBY_E#}\"\n  },\n  \"1008\": {\n    \"release\": 1682460000,\n    \"icon\": \"arlan\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Arlan\",\n    \"enhance\": [],\n    \"desc\": \"The head of Herta Space Station's Security Department.\\\\nThis quiet boy hopes to protect the researchers who value their pursuit of knowledge, and to help them to complete their work.\",\n    \"ko\": \"아를란\",\n    \"zh\": \"阿兰\",\n    \"ja\": \"アーラン\"\n  },\n  \"1009\": {\n    \"release\": 1682460000,\n    \"icon\": \"asta\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Asta\",\n    \"enhance\": [],\n    \"desc\": \"The lead researcher of Herta Space Station and a lady from a renowned family.\\\\nShe's an astronomer overflowing with curiosity, and excels at managing the disparate staff of the space station.\",\n    \"ko\": \"아스타\",\n    \"zh\": \"艾丝妲\",\n    \"ja\": \"アスター\"\n  },\n  \"1013\": {\n    \"release\": 1682460000,\n    \"icon\": \"herta\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Herta\",\n    \"enhance\": [],\n    \"desc\": \"Member \u003Cunbreak>83\u003C/unbreak> of the Genius Society. The real master of the space station.\\\\nAn incredibly intelligent yet unsympathetic scientist.\",\n    \"ko\": \"헤르타\",\n    \"zh\": \"黑塔\",\n    \"ja\": \"ヘルタ\"\n  },\n  \"1014\": {\n    \"release\": 1752224400,\n    \"icon\": \"saber\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Saber\",\n    \"enhance\": [],\n    \"desc\": \"The solitary Heroic Spirit traverses the long night of fate. The banner of the round table remains unfurled in a dream. Alas, the knight-king of Camelot has yet to reach that ever-distant utopia.\\\\nThough still a young maiden, she has heeded the call for this most unique iteration of the Holy Grail War. With the Sword in the Stone offering its choice once more, how shall she shatter the illusions of the past?\\\\n— \u003Ci>\\\"The wishes I did not fulfill will end here.\\\"\u003C/i>\",\n    \"ko\": \"세이버\",\n    \"zh\": \"Saber\",\n    \"ja\": \"セイバー\"\n  },\n  \"1015\": {\n    \"release\": 1752224400,\n    \"icon\": \"archer\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Archer\",\n    \"enhance\": [],\n    \"desc\": \"Despair plays in cycles between the past and future. Countless ideals were incinerated before that red garment. Yet, do not let this smear of ashes fool you —\\\\nShould someone create a phantasmal sweet dream under the guise of false ideals, then he will burn again, facing down the hypocrites of the world till the very end.\\\\nNo matter where he is, he always remains the steadfast champion of justice.\",\n    \"ko\": \"아처\",\n    \"zh\": \"Archer\",\n    \"ja\": \"アーチャー\"\n  },\n  \"1101\": {\n    \"release\": 1682460000,\n    \"icon\": \"bronya\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Bronya\",\n    \"enhance\": [],\n    \"desc\": \"Heir apparent to the Supreme Guardian of Belobog.\\\\nShe possesses pride befitting of a princess, but also the determination and integrity of a soldier.\",\n    \"ko\": \"브로냐\",\n    \"zh\": \"布洛妮娅\",\n    \"ja\": \"ブローニャ\"\n  },\n  \"1102\": {\n    \"release\": 1682460000,\n    \"icon\": \"seele\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Seele\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A resident of the Underworld and the backbone of Wildfire. She goes by the alias \\\"Babochka.\\\"\\\\nShe has a frank personality, but there is a delicate and sensitive hidden side to her deep in her heart.\",\n    \"ko\": \"제레\",\n    \"zh\": \"希儿\",\n    \"ja\": \"ゼーレ\"\n  },\n  \"1103\": {\n    \"release\": 1682460000,\n    \"icon\": \"serval\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Serval\",\n    \"enhance\": [],\n    \"desc\": \"A Belobog mechanic who used to be a researcher for the Technology Division of the Architects.\\\\nAs Gepard Landau's elder sister, her personality stands in stark contrast to her brother's.\\\\nShe loves an ancient form of music known as \\\"rock 'n' roll\\\" that was popular before the Eternal Freeze.\",\n    \"ko\": \"서벌\",\n    \"zh\": \"希露瓦\",\n    \"ja\": \"セーバル\"\n  },\n  \"1104\": {\n    \"release\": 1682460000,\n    \"icon\": \"gepard\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Knight\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Gepard\",\n    \"enhance\": [],\n    \"desc\": \"A captain in the Silvermane Guards and an outstanding warrior of Belobog.\\\\nHe is meticulous and vigilant to the core and is always true to himself.\",\n    \"ko\": \"게파드\",\n    \"zh\": \"杰帕德\",\n    \"ja\": \"ジェパード\"\n  },\n  \"1105\": {\n    \"release\": 1682460000,\n    \"icon\": \"natasha\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Priest\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Natasha\",\n    \"enhance\": [],\n    \"desc\": \"A doctor from the Underworld and a caregiver of children.\\\\nAlongside her kindness and caring, she also has a hidden dangerous side.\",\n    \"ko\": \"나타샤\",\n    \"zh\": \"娜塔莎\",\n    \"ja\": \"ナターシャ\"\n  },\n  \"1106\": {\n    \"release\": 1682460000,\n    \"icon\": \"pela\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Pela\",\n    \"enhance\": [],\n    \"desc\": \"An intelligence officer for the Silvermane Guards.\\\\nShe has a serious personality and is revered by other members of the Silvermane Guards.\",\n    \"ko\": \"페라\",\n    \"zh\": \"佩拉\",\n    \"ja\": \"ペラ\"\n  },\n  \"1107\": {\n    \"release\": 1682460000,\n    \"icon\": \"clara\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Clara\",\n    \"enhance\": [],\n    \"desc\": \"A vagrant girl who lives with robots.\\\\nShe is introverted, gentle, and has a pure heart.\\\\nShe wishes for all Underworlders to become a family.\",\n    \"ko\": \"클라라\",\n    \"zh\": \"克拉拉\",\n    \"ja\": \"クラーラ\"\n  },\n  \"1108\": {\n    \"release\": 1682460000,\n    \"icon\": \"sampo\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Sampo\",\n    \"enhance\": [],\n    \"desc\": \"A merchant who freely travels between the Overworld and the Underworld.\\\\nHe acts like he is everyone's friend, is enthusiastically humorous, and is good at bantering.\",\n    \"ko\": \"삼포\",\n    \"zh\": \"桑博\",\n    \"ja\": \"サンポ\"\n  },\n  \"1109\": {\n    \"release\": 1682460000,\n    \"icon\": \"hook\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Hook\",\n    \"enhance\": [],\n    \"desc\": \"Boss (self-proclaimed) of an Underworld adventure squad, The Moles.\\\\nShe loves freedom and sees life as a series of adventures.\",\n    \"ko\": \"후크\",\n    \"zh\": \"虎克\",\n    \"ja\": \"フック\"\n  },\n  \"1110\": {\n    \"release\": 1695200400,\n    \"icon\": \"lynx\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Priest\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Lynx\",\n    \"enhance\": [],\n    \"desc\": \"A Belobogian Snow Plains Explorer, and the youngest of the Landau siblings.\\\\nCalm and collected, with a strong drive for action. Often embarks on solo adventures to explore the snowy wilderness.\",\n    \"ko\": \"링스\",\n    \"zh\": \"玲可\",\n    \"ja\": \"リンクス\"\n  },\n  \"1111\": {\n    \"release\": 1689757200,\n    \"icon\": \"luka\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Luka\",\n    \"enhance\": [],\n    \"desc\": \"The boxing champion in Belobog's Underworld, and one of Wildfire's most capable fighters.\\\\nThe consecutive reigning champion of the Fight Club, whose enthusiasm inspires children of the Underworld to dream big.\",\n    \"ko\": \"루카\",\n    \"zh\": \"卢卡\",\n    \"ja\": \"ルカ\"\n  },\n  \"1112\": {\n    \"release\": 1698483600,\n    \"icon\": \"topaz\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Topaz & Numby\",\n    \"enhance\": [],\n    \"desc\": \"Topaz is the Leader of the Special Debts Picket Team and high-level manager of the Strategic Investment Department under the Interastral Peace Corporation.\\\\nA member of the \\\"Ten Stonehearts\\\" at a young age, Topaz's foundational expertise is \\\"debt retrieval.\\\"\\\\nHer partner, the Warp Trotter \\\"Numby,\\\" is also capable of keenly perceiving where \\\"riches\\\" are located, ensuring that jobs based in security, debt collection, and actuarial varieties are of no great challenge.\\\\nAt presently they are traveling the cosmos together, seeking all manner of liability disputes that might be affecting the stable progression of the IPC's businesses.\",\n    \"ko\": \"토파즈&복순이\",\n    \"zh\": \"托帕&账账\",\n    \"ja\": \"トパーズ&カブ\"\n  },\n  \"1201\": {\n    \"release\": 1682460000,\n    \"icon\": \"qingque\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Qingque\",\n    \"enhance\": [],\n    \"desc\": \"Diviner of the Divination Commission on the Xianzhou Luofu, and a librarian.\\\\nAlways slacks off and is about to be demoted to a \\\"door guardian.\\\"\",\n    \"ko\": \"청작\",\n    \"zh\": \"青雀\",\n    \"ja\": \"{RUBY_B#セイジャク}青雀{RUBY_E#}\"\n  },\n  \"1202\": {\n    \"release\": 1682460000,\n    \"icon\": \"tingyun\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Tingyun\",\n    \"enhance\": [],\n    \"desc\": \"Amicassador of the Sky-Faring Commission of the Xianzhou Luofu.\\\\nShe travels with business delegates, forging trade relationships and alliances with many worlds.\",\n    \"ko\": \"정운\",\n    \"zh\": \"停云\",\n    \"ja\": \"{RUBY_B#テイウン}停雲{RUBY_E#}\"\n  },\n  \"1203\": {\n    \"release\": 1687942800,\n    \"icon\": \"luocha\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Priest\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Luocha\",\n    \"enhance\": [],\n    \"desc\": \"Carrying a coffin wherever he goes, he is a foreign trader who came from beyond the stellar seas.\\\\nHas excellent medical skills.\",\n    \"ko\": \"나찰\",\n    \"zh\": \"罗刹\",\n    \"ja\": \"{RUBY_B#ラセツ}羅刹{RUBY_E#}\"\n  },\n  \"1204\": {\n    \"release\": 1684335600,\n    \"icon\": \"jingyuan\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Jing Yuan\",\n    \"enhance\": [],\n    \"desc\": \"The Divine Foresight, one of the Seven Arbiter-Generals of the Xianzhou Alliance, leads the Cloud Knights of the Xianzhou Luofu.\\\\nA student of the Luofu's previous Sword Champion, though not known for his martial prowess.\",\n    \"ko\": \"경원\",\n    \"zh\": \"景元\",\n    \"ja\": \"{RUBY_B#ケイゲン}景元{RUBY_E#}\"\n  },\n  \"1205\": {\n    \"release\": 1689757200,\n    \"icon\": \"blade\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Blade\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A member of the Stellaron Hunters, and a swordsman who abandoned his body to become a blade.\\\\nPledges loyalty to \\\"Destiny's Slave,\\\" and possesses a terrifying self-healing ability.\",\n    \"ko\": \"블레이드\",\n    \"zh\": \"刃\",\n    \"ja\": \"{RUBY_B#ジン}刃{RUBY_E#}\"\n  },\n  \"1206\": {\n    \"release\": 1682460000,\n    \"icon\": \"sushang\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Sushang\",\n    \"enhance\": [],\n    \"desc\": \"Born on the Xianzhou Yaoqing, sent to the Cloud Knights of the Luofu for military training.\\\\nShe wields her family sword, a gift from her mother, and longs for the future she will go on to write.\",\n    \"ko\": \"소상\",\n    \"zh\": \"素裳\",\n    \"ja\": \"{RUBY_B#スショウ}素裳{RUBY_E#}\"\n  },\n  \"1207\": {\n    \"release\": 1687942800,\n    \"icon\": \"yukong\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Yukong\",\n    \"enhance\": [],\n    \"desc\": \"Head of the Sky-Faring Commission on the Xianzhou Luofu. Yukong was a seasoned pilot and a deadshot.\\\\nSince heading up the commission, she's been buried under mountains of paperwork.\",\n    \"ko\": \"어공\",\n    \"zh\": \"驭空\",\n    \"ja\": \"{RUBY_B#ギョクウ}御空{RUBY_E#}\"\n  },\n  \"1208\": {\n    \"release\": 1695200400,\n    \"icon\": \"fuxuan\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Knight\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Fu Xuan\",\n    \"enhance\": [],\n    \"desc\": \"Head of the Divination Commission on the Luofu.\\\\nThe person who uses the third eye and Matrix of Prescience to foretell the route of Xianzhou and the outcomes of events.\",\n    \"ko\": \"부현\",\n    \"zh\": \"符玄\",\n    \"ja\": \"{RUBY_B#フゲン}符玄{RUBY_E#}\"\n  },\n  \"1209\": {\n    \"release\": 1682460000,\n    \"icon\": \"yanqing\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Yanqing\",\n    \"enhance\": [],\n    \"desc\": \"General Jing Yuan's retainer. A gifted swordsman who hasn't even come of age.\\\\nNo one can best Yanqing when he holds a sword in hand.\",\n    \"ko\": \"연경\",\n    \"zh\": \"彦卿\",\n    \"ja\": \"{RUBY_B#ゲンキョウ}彦卿{RUBY_E#}\"\n  },\n  \"1210\": {\n    \"release\": 1698483600,\n    \"icon\": \"guinaifen\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Guinaifen\",\n    \"enhance\": [],\n    \"desc\": \"A performance artist visiting the Xianzhou Luofu — in other words, a street performer.\\\\nShe's chasing a new life on the Luofu when not concerned with food and shelter.\",\n    \"ko\": \"계네빈\",\n    \"zh\": \"桂乃芬\",\n    \"ja\": \"{RUBY_B#ケイナイフン}桂乃芬{RUBY_E#}\"\n  },\n  \"1211\": {\n    \"release\": 1682460000,\n    \"icon\": \"bailu\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Priest\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Bailu\",\n    \"enhance\": [],\n    \"desc\": \"The High Elder of the Vidyadhara, who is also known as the \\\"Healer Lady\\\" on the Luofu.\\\\nShe uses her unique medical science and the medical treatment that can only be provided by the Vidyadhara dragon race to save lives.\",\n    \"ko\": \"백로\",\n    \"zh\": \"白露\",\n    \"ja\": \"{RUBY_B#ビャクロ}白露{RUBY_E#}\"\n  },\n  \"1212\": {\n    \"release\": 1697014800,\n    \"icon\": \"jingliu\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Jingliu\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"Former Sword Champion of the Luofu, and the creator of the Cloud Knights' legends of undefeated might.\\\\nNow, her name has been wiped from the records, and she is a traitor of the Xianzhou walking on the fine line between sanity and mara-struck.\",\n    \"ko\": \"경류\",\n    \"zh\": \"镜流\",\n    \"ja\": \"{RUBY_B#ケイリュウ}鏡流{RUBY_E#}\"\n  },\n  \"1213\": {\n    \"release\": 1693386000,\n    \"icon\": \"danhengil\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Dan Heng • Imbibitor Lunae\",\n    \"enhance\": [],\n    \"desc\": \"Dan Heng's true form from his Vidyadhara lineage carries the residual power left behind by his past incarnation, the Imbibitor Lunae.\\\\nUpon accepting the majestic horns atop his crown, he must accept all the merits and faults attributed to that sinner.\",\n    \"ko\": \"단항•음월\",\n    \"zh\": \"丹恒•饮月\",\n    \"ja\": \"{RUBY_B#タンコウ}丹恒{RUBY_E#}・{RUBY_B#インゲツ}飲月{RUBY_E#}\"\n  },\n  \"1214\": {\n    \"release\": 1703671200,\n    \"icon\": \"xueyi\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Xueyi\",\n    \"enhance\": [],\n    \"desc\": \"Judge of the Ten-Lords Commission, which presides over the jurisdiction of life and death on the Luofu.\\\\nFor years after her death, she inhabited a puppet body and returned to the world to fulfill her mission.\",\n    \"ko\": \"설의\",\n    \"zh\": \"雪衣\",\n    \"ja\": \"{RUBY_B#セツイ}雪衣{RUBY_E#}\"\n  },\n  \"1215\": {\n    \"release\": 1701856800,\n    \"icon\": \"hanya\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Hanya\",\n    \"enhance\": [],\n    \"desc\": \"One of the judges of the Xianzhou Luofu's Ten-Lords Commission.\\\\nOrdained by the Ten-Lords and wielding the authority of the Oracle Brush, she reads the multitudes of human sins and transgressions, then issues punishments and karmic retribution.\",\n    \"ko\": \"한아\",\n    \"zh\": \"寒鸦\",\n    \"ja\": \"{RUBY_B#カンア}寒鴉{RUBY_E#}\"\n  },\n  \"1217\": {\n    \"release\": 1700042400,\n    \"icon\": \"huohuo\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Priest\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Huohuo\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A trainee Ten-Lords Commission Judge of the Xianzhou Luofu, she is a young foxian girl possessed by a heliobus.\\\\nShe is a timid and weak girl who is afraid of all kinds of strange things, but is responsible for luring and subduing evil spirits.\",\n    \"ko\": \"곽향\",\n    \"zh\": \"藿藿\",\n    \"ja\": \"フォフォ\"\n  },\n  \"1218\": {\n    \"release\": 1724230800,\n    \"icon\": \"jiaoqiu\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Jiaoqiu\",\n    \"enhance\": [],\n    \"desc\": \"A foxian healer and counselor from the Xianzhou Yaoqing. Often greets people with a smile on his face and a scheme in his heart.\\\\nBorn into a prestigious Alchemy Commission family, he once withdrew from practicing medicine due to a broken heart. However, he returned to the field to treat \\\"the Merlin's Claw,\\\" General Feixiao.\\\\nSkilled in the study of alchemical prescription that views food as medicine, especially those that induce a sensation of spiciness. He invented a cauldron-based medicinal formula known as the \\\"nine-squared grid.\\\"\",\n    \"ko\": \"초구\",\n    \"zh\": \"椒丘\",\n    \"ja\": \"{RUBY_B#ショウキュウ}椒丘{RUBY_E#}\"\n  },\n  \"1220\": {\n    \"release\": 1725958800,\n    \"icon\": \"feixiao\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Feixiao\",\n    \"enhance\": [],\n    \"desc\": \"The Xianzhou Yaoqing's Merlin's Claw and one of the Seven Arbiter-Generals. Unconventional and straightforward, she exudes effortless charm.\\\\nShe is skilled in all forms of martial arts and has honed herself into a supreme weapon. She is widely adored by Xianzhou soldiers and civilians alike as \\\"The Vanquishing General.\\\"\\\\nHowever, she bears the burden of the Moon Rage affliction. If she were to hunt down all the abominations in her limited lifetime — then the only enemy Feixiao has would be herself.\",\n    \"ko\": \"비소\",\n    \"zh\": \"飞霄\",\n    \"ja\": \"{RUBY_B#ヒショウ}飛霄{RUBY_E#}\"\n  },\n  \"1221\": {\n    \"release\": 1722416400,\n    \"icon\": \"yunli\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Yunli\",\n    \"enhance\": [],\n    \"desc\": \"A sword hunter from the Xianzhou Zhuming and \\\"the Flaming Heart\\\" General Huaiyan's darling granddaughter. Frank and straightforward.\\\\nShe has learned swordplay and forging from Huaiyan since she was young, and thus is the second-youngest prodigy swordmaster of the Flamewheel Octet.\\\\nFueled by an intense loathing for the cursed swords that emerged from the Zhuming, she vowed to \\\"hunt down and wipe out all cursed swords.\\\"\",\n    \"ko\": \"운리\",\n    \"zh\": \"云璃\",\n    \"ja\": \"{RUBY_B#ウンリ}雲璃{RUBY_E#}\"\n  },\n  \"1222\": {\n    \"release\": 1727859600,\n    \"icon\": \"lingsha\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Priest\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Lingsha\",\n    \"enhance\": [],\n    \"desc\": \"The new Cauldron Master of the Xianzhou Luofu's Alchemy Commission is one perceptive and intelligent Vidyadhara healer.\\\\nWith a keen sense of smell, she diagnoses ailments and calms minds with aromatic therapy.\\\\nAdept at navigating complex social relationships, she can remain impeccably composed even when turmoil rages within.\",\n    \"ko\": \"영사\",\n    \"zh\": \"灵砂\",\n    \"ja\": \"{RUBY_B#レイサ}霊砂{RUBY_E#}\"\n  },\n  \"1223\": {\n    \"release\": 1725958800,\n    \"icon\": \"moze\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Moze\",\n    \"enhance\": [],\n    \"desc\": \"A Shadow Guard of the Yaoqing, Moze is taciturn and solitary, always acting on his own.\\\\nAs an expert in intelligence services and other operations that must remain covert, Moze rarely shows himself before others. The moment he reveals his blade usually spells doom for his enemies.\\\\nHe commands a vast wealth of assassination techniques, coupled with an extraordinary obsession for orderliness and cleanliness.\",\n    \"ko\": \"맥택\",\n    \"zh\": \"貊泽\",\n    \"ja\": \"モゼ\"\n  },\n  \"1224\": {\n    \"release\": 1722416400,\n    \"icon\": \"mar7th2\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"March 7th\",\n    \"enhance\": [],\n    \"desc\": \"March 7th in a Xianzhou-styled outfit. A sword-wielding female martial artist.\\\\nLearning swordplay from both Yunli and Yanqing, she is eager to create more beautiful memories on the Xianzhou.\",\n    \"ko\": \"Mar. 7th\",\n    \"zh\": \"三月七\",\n    \"ja\": \"{RUBY_B#みつき}三月{RUBY_E#}なのか\"\n  },\n  \"1225\": {\n    \"release\": 1735120800,\n    \"icon\": \"fugue\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Fugue\",\n    \"enhance\": [],\n    \"desc\": \"A tactful foxian girl, whose appearance, name, and identity have all been stolen.\\\\nThe fates have left her a thread of chance at survival, yet the brand of Destruction still writhes with anticipation.\\\\nThe one in a fugue who has experienced life and death and is given a new life... when would she be able to return home?\",\n    \"ko\": \"망귀인\",\n    \"zh\": \"忘归人\",\n    \"ja\": \"{RUBY_B#きぼう}帰忘{RUBY_E#}の{RUBY_B#さすらいびと}流離人{RUBY_E#}\"\n  },\n  \"1301\": {\n    \"release\": 1711533600,\n    \"icon\": \"gallagher\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Priest\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Gallagher\",\n    \"enhance\": [],\n    \"desc\": \"A security officer of the Bloodhound Family at Penacony. He is always courteous toward visiting guests but keeps his vigilance about him. He seems to carry a weight of a complicated past, yet he never voluntarily divulges any details.\",\n    \"ko\": \"갤러거\",\n    \"zh\": \"加拉赫\",\n    \"ja\": \"ギャラガー\"\n  },\n  \"1302\": {\n    \"release\": 1701856800,\n    \"icon\": \"argenti\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Argenti\",\n    \"enhance\": [],\n    \"desc\": \"A paragon knight of the Knights of Beauty who is piously seeking his missing Aeon, Idrila the Beauty.\\\\nForthright and candid, he wanders the cosmos espousing the virtues of Idrila's good name.\",\n    \"ko\": \"아젠티\",\n    \"zh\": \"银枝\",\n    \"ja\": \"アルジェンティ\"\n  },\n  \"1303\": {\n    \"release\": 1703671200,\n    \"icon\": \"ruanmei\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Ruan Mei\",\n    \"enhance\": [],\n    \"desc\": \"A member of the Genius Society and an expert in life sciences. She teamed up with Herta and others to develop the Simulated Universe.\",\n    \"ko\": \"완•매\",\n    \"zh\": \"阮•梅\",\n    \"ja\": \"ルアン・メェイ\"\n  },\n  \"1304\": {\n    \"release\": 1713344400,\n    \"icon\": \"aventurine\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Knight\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Aventurine\",\n    \"enhance\": [],\n    \"desc\": \"A high-ranking executive of the IPC's Strategic Investment Department.\\\\nA risk-taker, his constant smile makes it difficult for people to discern his true feelings.\",\n    \"ko\": \"어벤츄린\",\n    \"zh\": \"砂金\",\n    \"ja\": \"アベンチュリン\"\n  },\n  \"1305\": {\n    \"release\": 1705485600,\n    \"icon\": \"drratio\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Dr. Ratio\",\n    \"enhance\": [],\n    \"desc\": \"Member of the Intelligentsia Guild.\\\\nEccentric temperament, sharp-tongued but with an elegant demeanor.\\\\nThe face under the strange alabaster head sculpture is apparently unexpectedly handsome.\",\n    \"ko\": \"Dr. 레이시오\",\n    \"zh\": \"真理医生\",\n    \"ja\": \"Dr.レイシオ\"\n  },\n  \"1306\": {\n    \"release\": 1707213600,\n    \"icon\": \"sparkle\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Sparkle\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A member of the Masked Fools. Inscrutable and unscrupulous.\\\\nA dangerous maestro of theatrics, utterly engrossed in the art of performance. Adorned with innumerable masks, she is the hero with a thousand faces.\\\\nWealth, status, power... None of those matters to Sparkle. The only thing that can get her attention is \\\"amusement.\\\"\",\n    \"ko\": \"스파클\",\n    \"zh\": \"花火\",\n    \"ja\": \"{RUBY_B#はなび}花火{RUBY_E#}\"\n  },\n  \"1307\": {\n    \"release\": 1707213600,\n    \"icon\": \"blackswan\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Black Swan\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A Memokeeper of the Garden of Recollection. An indolent and mysterious soothsayer.\\\\n\\\"Remembrance\\\" of men are hers to heed, threads of fate are hers to tug.\",\n    \"ko\": \"블랙 스완\",\n    \"zh\": \"黑天鹅\",\n    \"ja\": \"ブラックスワン\"\n  },\n  \"1308\": {\n    \"release\": 1711533600,\n    \"icon\": \"acheron\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Acheron\",\n    \"enhance\": [],\n    \"desc\": \"A drifter claiming to be a Galaxy Ranger. Her true name is unknown.\\\\nShe walks the cosmos alone, carrying with her a long sword.\",\n    \"ko\": \"아케론\",\n    \"zh\": \"黄泉\",\n    \"ja\": \"{RUBY_B#よみ}黄泉{RUBY_E#}\"\n  },\n  \"1309\": {\n    \"release\": 1715158800,\n    \"icon\": \"robin\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Robin\",\n    \"enhance\": [],\n    \"desc\": \"A Halovian singer who was born in Penacony and has risen to cosmic fame. An elegant and demure young lady.\\\\nThis time, she has been invited home by The Family to grace everyone with song during the Charmony Festival.\\\\nShe can use the power of \\\"Harmony\\\" to broadcast her music, manifesting \\\"resonance\\\" among not only her fans but all manner of lifeforms.\",\n    \"ko\": \"로빈\",\n    \"zh\": \"知更鸟\",\n    \"ja\": \"ロビン\"\n  },\n  \"1310\": {\n    \"release\": 1718787600,\n    \"icon\": \"sam\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Firefly\",\n    \"enhance\": [\n      1\n    ],\n    \"desc\": \"A member of the Stellaron Hunters, clad in a set of mechanized armor known as \\\"SAM.\\\" Her character is marked by unwavering loyalty and steely resolve.\\\\nEngineered as a weapon against the Swarm, she experiences accelerated growth, but a tragically shortened lifespan.\\\\nShe joined the Stellaron Hunters in a quest for a chance at \\\"life,\\\" seeking to defy her fated demise.\",\n    \"ko\": \"반디\",\n    \"zh\": \"流萤\",\n    \"ja\": \"ホタル\"\n  },\n  \"1312\": {\n    \"release\": 1709200800,\n    \"icon\": \"misha\",\n    \"rank\": \"CombatPowerAvatarRarityType4\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Misha\",\n    \"enhance\": [],\n    \"desc\": \"A well-behaved young man serving as a hotel bellboy in Penacony.\\\\nMisha has a great longing for the Nameless and dreams of one day embarking on a journey of his own.\",\n    \"ko\": \"미샤\",\n    \"zh\": \"米沙\",\n    \"ja\": \"ミーシャ\"\n  },\n  \"1313\": {\n    \"release\": 1733306400,\n    \"icon\": \"sunday\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Sunday\",\n    \"enhance\": [],\n    \"desc\": \"The dream of the Order has dissipated, yet there are still those who will not give up on their original intent.\\\\n — The traveler whose wings were clipped... whereto shall his footsteps lead?\",\n    \"ko\": \"선데이\",\n    \"zh\": \"星期日\",\n    \"ja\": \"サンデー\"\n  },\n  \"1314\": {\n    \"release\": 1720602000,\n    \"icon\": \"jade\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Jade\",\n    \"enhance\": [],\n    \"desc\": \"A senior manager in the IPC Strategic Investment Department and one of the Ten Stonehearts, known for her cornerstone \\\"Jade of Credit.\\\"\\\\nA beautiful and elegant moneylender, she is skilled in deciphering the depths of people's minds, with a personal hobby called \\\"Bonajade Exchange.\\\"\\\\nShe's willing to wait patiently for high-value acquisitions and adept at extracting value from seemingly destitute clients.\",\n    \"ko\": \"제이드\",\n    \"zh\": \"翡翠\",\n    \"ja\": \"ジェイド\"\n  },\n  \"1315\": {\n    \"release\": 1716973200,\n    \"icon\": \"boothill\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Boothill\",\n    \"enhance\": [],\n    \"desc\": \"A cyborg cowboy drifting among the stars. Extremely optimistic and unrestrained.\\\\nHe is a member of the Galaxy Rangers who swore to punish the wretched by any and all means...\\\\nHis flamboyant and brash actions were all to draw the attention of the Interastral Peace Corporation — the target of his revenge.\",\n    \"ko\": \"부트힐\",\n    \"zh\": \"波提欧\",\n    \"ja\": \"ブートヒル\"\n  },\n  \"1317\": {\n    \"release\": 1729674000,\n    \"icon\": \"rappa\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Rappa\",\n    \"enhance\": [],\n    \"desc\": \"A peculiar girl who appears in Penacony like a flashbang at the darkest hour of night, identifying herself as a ninja and attributing everything in the world to \\\"ninjutsu.\\\"\\\\nUpholding the recitation of ninja mantra, creating Dazzling Ninja Seals, and studying ninja scrolls — That is, the Way of the Ninja involves rap, graffiti, and manga — Through rigorous self-discipline, she roams the stars, upholding justice and righteousness.\\\\nAs a member of the Galaxy Rangers, she relentlessly pursues the villain known as Evil Ninja Osaru, chasing them to the very edge of the Cosmos.\",\n    \"ko\": \"라파\",\n    \"zh\": \"乱破\",\n    \"ja\": \"{RUBY_B#らんは}乱破{RUBY_E#}\"\n  },\n  \"1321\": {\n    \"release\": 1765101600,\n    \"icon\": \"dahlia\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Fire\",\n    \"en\": \"The Dahlia\",\n    \"enhance\": [],\n    \"desc\": \"The sweet dream burned down the Ever-Flame Mansion, taking with it every trace of \\\"her.\\\"\\\\nDestruction, Remembrance... flowers of betrayal bloomed wherever they passed.\\\\nTo return to the dreamscape no one remembers, who will be the one to set her aflame again?\",\n    \"ko\": \"달리아\",\n    \"zh\": \"大丽花\",\n    \"ja\": \"ダリア\"\n  },\n  \"1401\": {\n    \"release\": 1736935200,\n    \"icon\": \"theherta\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Ice\",\n    \"en\": \"The Herta\",\n    \"enhance\": [],\n    \"desc\": \"Esteemed Genius Society #83, human, female, young, beautiful, attractive.\\\\nIt's said that she lives in the far edge of the Cosmos, almost never leaving. Sounds like her appearance this time...\\\\n...must be for some issue that requires a personal touch, right?\",\n    \"ko\": \"더 헤르타\",\n    \"zh\": \"大黑塔\",\n    \"ja\": \"マダム・ヘルタ\"\n  },\n  \"1402\": {\n    \"release\": 1738749600,\n    \"icon\": \"aglaea\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Memory\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Aglaea\",\n    \"enhance\": [],\n    \"desc\": \"In that holy city kissed by the dawn, the weaver caresses the golden threads, entwining fates.\\\\nThe Chrysos Heir that bears the \\\"Romance\\\" Coreflame gathered the world's heroes, leading them on a long journey once more\\\\n— to topple the gods, reclaim the divine flame, and grant rebirth to the nearly fallen Amphoreus.\",\n    \"ko\": \"아글라이아\",\n    \"zh\": \"阿格莱雅\",\n    \"ja\": \"アグライア\"\n  },\n  \"1403\": {\n    \"release\": 1740564000,\n    \"icon\": \"tribbie\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Tribbie\",\n    \"enhance\": [],\n    \"desc\": \"From that holy land blessed by the tripartite prophecy, the messenger split into a thousand forms, embarking on a long journey.\\\\nTribios, Holy Maiden of Janusopolis, the Chrysos Heir who stole Passage's Coreflame, toiled for the masses and brought the news of deliverance to all domains.\\\\n—Seek the children of humanity with golden blood in their veins, shatter the dimmest dark in this world, and walk toward the tomorrow where the stars gleam.\",\n    \"ko\": \"트리비\",\n    \"zh\": \"缇宝\",\n    \"ja\": \"トリビー\"\n  },\n  \"1404\": {\n    \"release\": 1742378400,\n    \"icon\": \"mydei\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Mydei\",\n    \"enhance\": [],\n    \"desc\": \"Kremnos, the mist-shrouded city of chaos and war! Its royal lineage is tainted with patricide, and its god bears the name of calamity.\\\\nThe undying Mydeimos, the lion apart from the rest. Chrysos Heir who seeks the Coreflame of Strife, must suffer a thousand deaths, be bathed in blood on the path home, and bear the madness of fate alone.\\\\n— Kingslayer be king, godslayer be god. Iron-hooves pound across the wilderness for the campaign, and must eventually soak in the blood of their homeland.\",\n    \"ko\": \"마이데이\",\n    \"zh\": \"万敌\",\n    \"ja\": \"モーディス\"\n  },\n  \"1405\": {\n    \"release\": 1746003600,\n    \"icon\": \"anaxa\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Anaxa\",\n    \"enhance\": [],\n    \"desc\": \"The Grove of Epiphany, where knowledge flourishes and philosophers are born.\\\\nYet here stands Anaxagoras the blasphemer, the Chrysos Heir who challenges the Coreflame of Reason. He is questioned: Would you defy the prophecy even if you must bear infamy, and insist on driving the thorns of doubt into the Sacred Tree of wisdom?\\\\n——\u003Ci>\\\"Ridiculous. In a world full of lies, I am the only truth.\\\"\u003C/i>\",\n    \"ko\": \"아낙사\",\n    \"zh\": \"那刻夏\",\n    \"ja\": \"アナイクス\"\n  },\n  \"1406\": {\n    \"release\": 1749632400,\n    \"icon\": \"cipher\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Cipher\",\n    \"enhance\": [],\n    \"desc\": \"In the fallen city of bandits, Dolos, the \u003Cunbreak>300\u003C/unbreak> Rogues run wild and free.\\\\nRace onward, fleet-footed Thief Star Cifera, Chrysos Heir of the \\\"Trickery\\\" Coreflame. May your web of lies spread with the breeze throughout all lands—\\\\n\u003Ci>\\\"Tryna trick me? Not a chance!\\\"\u003C/i>\",\n    \"ko\": \"사이퍼\",\n    \"zh\": \"赛飞儿\",\n    \"ja\": \"サフェル\"\n  },\n  \"1407\": {\n    \"release\": 1744189200,\n    \"icon\": \"castorice\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Memory\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Castorice\",\n    \"enhance\": [],\n    \"desc\": \"Aidonia, the snowy land that respects and worships death, has already sunken into sweet slumber.\\\\nO Castorice, daughter of the River of Souls, the Chrysos Heir in search of the Coreflame of \\\"Death,\\\" set forth! Guard the lament of the souls in this world, and embrace the solitude of destiny.\\\\n— Life and death is a journey. When a butterfly rests on that dead branch, the withered will be reborn again.\",\n    \"ko\": \"카스토리스\",\n    \"zh\": \"遐蝶\",\n    \"ja\": \"キャストリス\"\n  },\n  \"1408\": {\n    \"release\": 1751446800,\n    \"icon\": \"phainon\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Phainon\",\n    \"enhance\": [],\n    \"desc\": \"Aedes Elysiae, a remote frontier village isolated from the world, now lives on only in cryptic legends.\\\\nThe nameless hero, ████████, the Chrysos Heir holding the Coreflame of \\\"Worldbearing,\\\" memorizes the ideals of the entire world, carries the fate of millions, and brings the first light of dawn to the new world\\\\n—\u003Ci>\\\"But if dawn should never come, let this fury consume this body, and rise as tomorrow's blazing sun!\\\"\u003C/i>\",\n    \"ko\": \"파이논\",\n    \"zh\": \"白厄\",\n    \"ja\": \"ファイノン\"\n  },\n  \"1409\": {\n    \"release\": 1747818000,\n    \"icon\": \"hyacine\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Memory\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Hyacine\",\n    \"enhance\": [],\n    \"desc\": \"As the city-state in the clouds crumbles through time, the Twilight Courtyard opens its gates once more, bringing a glimmer of light to Evernight.\\\\nPhysician Hyacinthia is the Chrysos Heir who watches over the Coreflame of Sky. Carrying the will of her ancestors, she mends the torn fabric of dusk and dawn.\\\\nMay the rainbow light pour down, dissolve all grudges, and bring the dawn back to this land.\",\n    \"ko\": \"히아킨\",\n    \"zh\": \"风堇\",\n    \"ja\": \"ヒアンシー\"\n  },\n  \"1410\": {\n    \"release\": 1755075600,\n    \"icon\": \"hysilens\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Hysilens\",\n    \"enhance\": [],\n    \"desc\": \"Styxia, the coastal city of intoxication and dreams, where echoes of old songs still drift among the waves.\\\\nHelektra, Daughter of the Sea, Chrysos Heir who cleanses the Ocean's Coreflame, dispels the murky undercurrents and orchestrates a banquet of revelry for the heroes beyond the sky.\\\\nThe show must go on. Even if hope is as fragile as bubbles, the waves will keep surging forward.\",\n    \"ko\": \"히실렌스\",\n    \"zh\": \"海瑟音\",\n    \"ja\": \"セイレンス\"\n  },\n  \"1412\": {\n    \"release\": 1756803600,\n    \"icon\": \"cerydra\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Shaman\",\n    \"damageType\": \"Wind\",\n    \"en\": \"Cerydra\",\n    \"enhance\": [],\n    \"desc\": \"The Northern Empire, a lost dynasty, where its frozen lands burn with the fever of conquest.\\\\nSovereign Cerydra, the Chrysos Heir who wields the Coreflame of \\\"Law,\\\" weaves her schemes, contends with the gods, passes judgment upon the faithless, and lays the foundation of Flame-Chase into this world.\\\\n...\u003Ci>\\\"This is far from the end. Amphoreus's journey is set to blaze across the stars!\\\"\u003C/i>\",\n    \"ko\": \"케리드라\",\n    \"zh\": \"刻律德菈\",\n    \"ja\": \"ケリュドラ\"\n  },\n  \"1413\": {\n    \"release\": 1758790800,\n    \"icon\": \"evernight\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Memory\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Evernight\",\n    \"enhance\": [],\n    \"desc\": \"In the Memory Zone secluded from the world, candlelight reflects the past, silently extinguishing in the mist.\\\\nEvernight, child of Remembrance emerging from those shadows, the Chrysos Heir who conceals the Coreflame of \\\"Time,\\\" raises the waves of \\\"Oblivion\\\" to protect the wishes of those in the mirror\\\\n\u003Ci>\\\"Don't worry, I will guard the path of Trailblaze for you... at any cost. ♭\\\"\u003C/i>\",\n    \"ko\": \"에버나이트\",\n    \"zh\": \"长夜月\",\n    \"ja\": \"{RUBY_B#ながよづき}長夜月{RUBY_E#}\"\n  },\n  \"1414\": {\n    \"release\": 1760173200,\n    \"icon\": \"danhengpt\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Knight\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Dan Heng • Permansor Terrae\",\n    \"enhance\": [],\n    \"desc\": \"The chest of Georios, the body of the fallen dragon supporting the shattered earth, enduring millennia of pain.\\\\nDan Heng, the Nameless and the Chrysos Heir who guards the Earth's Coreflame, steadies the world before it falls and guides all life across the land to a new home beyond.\\\\nRivers flow to the sea, mountains echo in harmony, and the eternal path stretches ten thousand miles.\",\n    \"ko\": \"단항•등황\",\n    \"zh\": \"丹恒•腾荒\",\n    \"ja\": \"{RUBY_B#たんこう}丹恒{RUBY_E#}・{RUBY_B#とうこう}騰荒{RUBY_E#}\"\n  },\n  \"1415\": {\n    \"release\": 1762336800,\n    \"icon\": \"cyrene\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Memory\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Cyrene\",\n    \"enhance\": [],\n    \"desc\": \"A meteor streaks across the night sky, stirring ripples in the river of life, shimmering with thirteen hues.\\\\nDaughter of Aedes Elysiae, nurturer of the Chrysos Heir of \\\"███,\\\" plants the Seed of Memory, letting yesterday's flowers bloom in tomorrow\\\\n—\u003Ci>\\\"Now, let's write a different kind of poem together♪\\\"\u003C/i>\",\n    \"ko\": \"키레네\",\n    \"zh\": \"昔涟\",\n    \"ja\": \"キュレネ\"\n  },\n  \"1501\": {\n    \"release\": 1770976800,\n    \"icon\": \"Sparxie\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Elation\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Sparxie\",\n    \"enhance\": [],\n    \"desc\": \"Like! Follow! Stream! Views! Party till the world ends!\\\\nSparxie and Sparkle, the Mask and the Fool are fundamentally the same.\\\\nWhoever is seen, whoever is liked, is the correct answer!\",\n    \"ko\": \"스파키\",\n    \"zh\": \"火花\",\n    \"ja\": \"{RUBY_B#ひばな}火花{RUBY_E#}\"\n  },\n  \"1502\": {\n    \"release\": 1770976800,\n    \"icon\": \"yaoguang\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Elation\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Yao Guang\",\n    \"enhance\": [],\n    \"desc\": \"Mysterious, bold, radical... her quest for change is stunning.\\\\nWith the \\\"eye\\\" of The Hunt, she sees all fates. Though she knows fate is immutable, the Seer Strategist still walks into danger alone.\\\\nWith the odds stacked against her, how can she possibly change her destiny?\",\n    \"ko\": \"효광\",\n    \"zh\": \"爻光\",\n    \"ja\": \"{RUBY_B#コウコウ}爻光{RUBY_E#}\"\n  },\n  \"1503\": {\n    \"icon\": \"pearl\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Elation\",\n    \"damageType\": \"Ice\",\n    \"en\": \"Pearl\",\n    \"enhance\": [],\n    \"desc\": \"Color the stars, trace the myriad phenomena, and the lost pearls of civilization regain their luster.\\\\nBorn from the art of analysis, she pursues the pinnacle of beauty, yet has never lost her underlying hue of the Preservation:\\\\nAfter her trial by fire, what kind of \\\"Pearl\\\" will she harvest?\",\n    \"ko\": \"펄\",\n    \"zh\": \"真珠\",\n    \"ja\": \"パール\"\n  },\n  \"1504\": {\n    \"release\": 1774432800,\n    \"icon\": \"ashveil\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Rogue\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Ashveil\",\n    \"enhance\": [],\n    \"desc\": \"He takes cases on a whim, cracks them with hard-core logic, and solves the strangest crimes on sheer instinct.\\\\nWith a monkey for an assistant and his heart set on retirement, the detective sleeps in a refrigerator, waiting for the bait to catch its willing prey.\\\\nUnder the light of the Phantasmoon, the vile beast howls. How will he draw the net on this hunt?\",\n    \"ko\": \"애쉬베일\",\n    \"zh\": \"不死途\",\n    \"ja\": \"{RUBY_B#しなず}不死途{RUBY_E#}\"\n  },\n  \"1505\": {\n    \"release\": 1778662800,\n    \"icon\": \"evanescia\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Elation\",\n    \"damageType\": \"Physical\",\n    \"en\": \"Evanescia\",\n    \"enhance\": [],\n    \"desc\": \"One season the Phantasmoon waxes full, one season the mortal world shifts anew: The mysterious girl reappears in Planarcadia!\\\\nFallen petals scatter with ease, and her stay was but a fleeting instant. Everything about this new era enthralls her, and she will not allow anyone to bring it to ruin...\\\\nA single ruler blade judges right from wrong, but who can say how much good or evil lies within oneself?\",\n    \"ko\": \"에바네시아\",\n    \"zh\": \"绯英\",\n    \"ja\": \"{RUBY_B#ひえい}緋英{RUBY_E#}\"\n  },\n  \"1506\": {\n    \"release\": 1776848400,\n    \"icon\": \"silverwolflv999\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Elation\",\n    \"damageType\": \"Imaginary\",\n    \"en\": \"Silver Wolf LV.\u003Cunbreak>999\u003C/unbreak>\",\n    \"enhance\": [],\n    \"desc\": \"A new season of Elation begins, featuring the limited-time return of the invincible player \\\"Silver Wolf LV.\u003Cunbreak>999\u003C/unbreak>\\\"!\\\\nShe's conquered the universe, unlocked every cosmic achievement... What's left to play?\\\\n\u003Ci>\\\"Reach the peak of 'Elation'? Boring... Since I've got the cartridge now, I make the rules~\\\"\u003C/i>\",\n    \"ko\": \"은랑 LV.\u003Cunbreak>999\u003C/unbreak>\",\n    \"zh\": \"银狼LV.\u003Cunbreak>999\u003C/unbreak>\",\n    \"ja\": \"{RUBY_B#ぎんろう}銀狼{RUBY_E#}LV.\u003Cunbreak>999\u003C/unbreak>\"\n  },\n  \"1507\": {\n    \"release\": 1780304400,\n    \"icon\": \"mortenaxblade\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warlock\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Mortenax Blade\",\n    \"enhance\": [],\n    \"desc\": \"Body like spring wood, heart like dead ash. Yet embers of a craftsman's spark still linger at his fingertips.\\\\nAs ancient grudges are ignited once more, he promises to send both himself and the gods to the other side...\\\\nTorn flesh, tempered a thousand times into a blade... What answer will it create?\",\n    \"ko\": \"천야•블레이드\",\n    \"zh\": \"千冶•刃\",\n    \"ja\": \"{RUBY_B#センヤ}千冶{RUBY_E#}・{RUBY_B#ジン}刃{RUBY_E#}\"\n  },\n  \"1508\": {\n    \"release\": 1784883600,\n    \"icon\": \"tohsakarin\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Rin Tohsaka\",\n    \"enhance\": [],\n    \"desc\": \"Hailing from a world beyond our universe where magic and magecraft coexist, this young mage tirelessly hones her skills. She is the Sixth Head of the Tohsaka family, a prestigious lineage of Fuyuki City mages.\",\n    \"ko\": \"토오사카 린\",\n    \"zh\": \"远坂凛\",\n    \"ja\": \"{RUBY_B#とおさかりん}遠坂凛{RUBY_E#}\"\n  },\n  \"1509\": {\n    \"release\": 1784883600,\n    \"icon\": \"gilgamesh\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Warrior\",\n    \"damageType\": \"Thunder\",\n    \"en\": \"Gilgamesh\",\n    \"enhance\": [],\n    \"desc\": \"The King of Heroes from the dawn of human history, hailing from a world beyond the stars.\\\\nPossessing a nature two-thirds divine and one-third mortal, he claims a natural-born prerogative to rule over all of creation.\",\n    \"ko\": \"길가메시\",\n    \"zh\": \"吉尔伽美什\",\n    \"ja\": \"ギルガメッシュ\"\n  },\n  \"1510\": {\n    \"release\": 1784106000,\n    \"icon\": \"himekonova\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Mage\",\n    \"damageType\": \"Fire\",\n    \"en\": \"Himeko • Nova\",\n    \"enhance\": [],\n    \"desc\": \"Some fight side by side, some keep watch. The Trailblaze is never a lonely voyage.\\\\nShe paints a trailblazing miracle. The silver rail stretches on, and the Nameless set sail once more, illuminating the galaxy's eternal night.\\\\nAt the end of the line, she looks back once again. The dream of setting forth has never run aground.\",\n    \"ko\": \"히메코•노바\",\n    \"zh\": \"姬子•启行\",\n    \"ja\": \"{RUBY_B#ひめこ}姫子{RUBY_E#}・{RUBY_B#たびだ}旅立{RUBY_E#}ち\"\n  },\n  \"1511\": {\n    \"icon\": \"nihilux\",\n    \"rank\": \"CombatPowerAvatarRarityType5\",\n    \"baseType\": \"Elation\",\n    \"damageType\": \"Quantum\",\n    \"en\": \"Aeon ★ Aha\",\n    \"enhance\": [],\n    \"desc\": \"Cries and comedy intertwine, and the deathly still cosmos awakens to daybreak in a farce.\\\\nStepping back onto the stage of the Path, I tear off the god's mask. Who is Aha? I am Aha!\\\\nTo play, to trick, to hunt... Please bear witness to an improv
