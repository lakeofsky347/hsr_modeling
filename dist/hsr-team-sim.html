.lc-sup select{width:auto;min-width:76px;padding:2px 6px;font-size:11.5px}
.lc-chip{display:inline-block;min-width:38px;text-align:center;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid #2b8f86;background:#0c2322;color:var(--accent);font-variant-numeric:tabular-nums}
.lc-chip.zero{border-color:var(--line2);background:#0e1626;color:var(--dim2)}
details.lc-descbox{margin:7px 0 0}
details.lc-descbox summary{cursor:pointer;list-style:none;font-size:10.5px;color:var(--dim);display:flex;gap:6px;align-items:baseline}
details.lc-descbox summary::-webkit-details-marker{display:none}
.lc-toggle{color:var(--accent2);border-bottom:1px dotted #46579c;flex:0 0 auto}
.lc-peek{color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
details.lc-descbox[open] summary .lc-peek{display:none}
details.lc-descbox[open]>summary .lc-toggle{color:var(--dim2);border-bottom-color:transparent}
.lc-desc{margin-top:4px;font-size:10.5px;line-height:1.55;color:var(--dim)}
.lc-stats{margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--dim2)}
.lc-stats b{color:#cfe0f5;font-weight:600;font-variant-numeric:tabular-nums}
.lc-tag{font-size:10px;padding:0 6px;border-radius:999px;border:1px solid var(--line2);background:#0d1727;color:var(--dim2);white-space:nowrap}
.lc-bonus{margin:6px 0 0;font-size:10px;color:var(--accent2);line-height:1.5}
.lc-compare{margin-top:9px}
.lc-table{width:100%;border-collapse:collapse;font-size:11.5px}
.lc-table thead th{position:static;background:transparent;color:var(--dim2);font-weight:500;font-size:10.5px;text-align:left;
  padding:2px 4px 5px;border-bottom:1px solid #1b2740;cursor:default;white-space:nowrap}
.lc-table thead th.num{text-align:right}
.lc-table tbody td{padding:5px 4px;border-bottom:1px solid #131e30;vertical-align:middle;white-space:nowrap}
.lc-table tbody tr:last-child td{border-bottom:0}
.lc-table tbody tr:hover{background:#0e1727}
.lc-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.lc-arrow{color:var(--dim2);margin-right:4px}
.lc-base{color:var(--dim2)}
.lc-now{color:var(--text);font-weight:500}
.lc-now.up{color:var(--accent);font-weight:600;text-shadow:0 0 8px #2fe0c855}
.lc-delta{font-size:10px;color:var(--dim2)}
.lc-delta.up{color:var(--accent)}
.lc-empty{margin-top:9px;font-size:11px;color:var(--dim2);border:1px dashed #1b2740;border-radius:8px;padding:8px 10px;background:#0a1120}
.lc-block.off .lc-name,.lc-block.off .lc-star,.lc-block.off .lc-passive{opacity:.5}
.lc-block.off .lc-descbox,[data-lc-dynamic]>.lc-desc,.lc-block.off .lc-stats{opacity:.55}
/* 时间轴：hits[].sources 乘区来源小标签（v1.2.0） */
.tl-src{margin-top:4px}
.tl-src summary{cursor:pointer;list-style:none;font-size:10px;color:var(--accent2);display:inline-block}
.tl-src summary::-webkit-details-marker{display:none}
.src-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.src-tags .tag{font-size:10px;color:var(--dim)}
</style>

<body>
<div id="previewBanner" class="banner" hidden><b>⚠</b><span>当前为预览模式（未内联引擎）</span><span class="muted">页面使用文件内嵌的 FALLBACK_ENGINE 演示数据结构，数值不代表真实战斗结果。</span></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">☺</div>
    <div>
      <h1>欢愉四人队 · 完美轴伤害模拟器</h1>
      <p class="sub">银狼LV.999 / 火花 / 真珠 / 星神★阿哈</p>
    </div>
  </div>
  <div class="topmeta">
    <span class="chip" id="chipVersion">引擎 v—</span>
    <span class="chip" id="chipMode">—</span>
    <span class="chip" id="simStatus">就绪</span>
  </div>
</header>

<div class="toolbar">
  <button class="btn primary" id="btnRun">重新模拟</button>
  <button class="btn" id="btnReset">重置默认</button>
  <button class="btn" id="btnExport">导出配置 JSON</button>
  <button class="btn" id="btnImport">导入配置 JSON</button>
  <button class="btn" id="btnCopyResult">复制结果 JSON</button>
  <label class="tgl"><input type="checkbox" id="tglSliders" checked> 滑块</label>
  <span class="spacer"></span>
  <span class="toast" id="toast" hidden></span>
</div>

<div class="jsonpanel" id="jsonPanel" hidden>
  <div class="jsonpanel-head">
    <strong id="jsonTitle">配置 JSON</strong>
    <span class="err" id="jsonError" hidden></span>
    <button class="btn tiny" id="btnJsonApply">应用</button>
    <button class="btn tiny" id="btnJsonCopy">复制</button>
    <button class="btn tiny" id="btnJsonClose">关闭</button>
  </div>
  <textarea id="jsonArea" spellcheck="false" placeholder="在此粘贴配置 JSON 后点击「应用」…"></textarea>
</div>

<main class="layout">
  <section class="col params-col">
    <div class="colhead">
      <h2>参数</h2>
      <div>
        <button class="mini" id="btnExpandAll">展开全部</button>
        <button class="mini" id="btnCollapseAll">收起全部</button>
      </div>
    </div>
    <div id="params"></div>
  </section>
  <section class="col results-col">
    <div class="colhead"><h2>结果</h2><div class="muted" id="resultMeta"></div></div>
    <div id="results"></div>
  </section>
</main>

var FALLBACK_ENGINE = (function () {

  /* ---- v1.1.0：星魂 / 技能等级（与 engine/sim.js 同结构；预览用静态数据） ---- */
  var EIDOLON_SKILL_BONUS = {

  var SLOT_CAPS = { basic: 10, skill: 15, ult: 15, talent: 15, elationSkill: 15, innate: 2, maze: 1 };

                      elationSkill: "欢愉技", innate: "固有行迹", maze: "秘技" };
  var BASE_CAPS = { basic: 6, skill: 10, ult: 10, talent: 10, elationSkill: 10 };
  var BASE_LEVEL_FIELDS = ["basic", "skill", "ult", "talent", "elationSkill"];
  var EIDOLON_NAMES = {
    "1506": ["以太编辑：星魂+1", "是机制，不是BUG", "只有15级？谁填的", "我来，我见，我..秒了", "平A即是大招", "我独自满级！"],
    "1501": ["#全网热搜：她是谁？", "#观众的眼睛是雪亮的", "#请点击：心跳超链接", "#硬控！顶级表情管理", "#世界破烂，小花缝补", "#锵锵，即将绝版的我"],
    "1503": ["珍珠，藏在海的留白处", "截取，顷刻破晓的光斑", "速写，惊涛悬停的刹那", "解译，唇角模糊的笑意", "透视，笔端星夜的肌理", "用一副躯壳，演算生命"],
    "1511": ["谁在太初噤声时笑场", "在祂的眼睛和你之间", "牌叠起，令悲喜轮回", "黑箱一个玩笑的命运", "台前幕后，是我非我", "因为神说：你就是欢愉"]

  var PREVIEW_DESC = "预览模式（未内联真实引擎）：此处仅演示星魂面板结构，效果原文与数值以引擎数据为准，不代表真实战斗结果。";

  /* ---- v1.2.0：专属光锥（结构同 engine/lightconedata.js；预览用静态数据） ----

  var LIGHTCONES = {
    "23053": { name: "花花世界迷人眼", passive: "瞩目", rarity: 5, path: "Elation",
      desc: "使装备者的暴击伤害提高#1[i]%。装备者在场时，队伍中每有1名「欢愉」命途的角色，战技点上限提高#2[i]点，最多提高#3[i]点；装备者每消耗1个战技点使自身造成的欢愉伤害无视敌方目标#6[f1]%的防御力，最多叠加#5[i]层，若在同一回合内消耗大于等于#7[i]个战技点则使装备者获得【推流】。装备者持有【推流】时，我方全体欢愉度提高#4[i]%。同类光锥效果无法叠加。",

               [0.72, 1, 3, 0.32, 4, 0.08, 4], [0.8, 1, 3, 0.36, 4, 0.09, 4]],
      stats: { hp: 1058.4, atk: 582.1, def: 463.1 } },
    "23055": { name: "献给明日的色彩", passive: "挥墨", rarity: 5, path: "Elation",
      desc: "使装备者的防御力提高#1[i]%。装备者对我方全体施放欢愉技时，使敌方全体受到的伤害提高#4[i]%，持续#3[i]回合，为装备者固定恢复#2[i]点能量，并为我方全体回复等同于装备者防御力#5[i]%的生命值。",
      levels: [[0.48, 10, 3, 0.22, 0.1], [0.6, 10, 3, 0.275, 0.125], [0.72, 10, 3, 0.33, 0.15],
               [0.84, 10, 3, 0.385, 0.175], [0.96, 10, 3, 0.44, 0.2]],
      stats: { hp: 1058.4, atk: 476.3, def: 595.3 } },
    "23057": { name: "欢迎来到银河城", passive: "稳赢", rarity: 5, path: "Elation",
      desc: "使装备者的速度提高#1[i]%，造成的欢愉伤害无视目标#2[i]%的防御力。当装备者对自身单体施放终结技时，获得#3[i]点【笑点】。该效果最多触发1次，施放#4[i]次普攻后重置可触发次数。",
      levels: [[0.18, 0.2, 20, 3], [0.21, 0.24, 25, 3], [0.24, 0.28, 30, 3], [0.27, 0.32, 35, 3], [0.3, 0.36, 40, 3]],
      stats: { hp: 1164.2, atk: 476.3, def: 529.2 } },
    "23065": { name: "当第一声「阿哈」响起", passive: "即兴巡演", rarity: 5, path: "Elation",
      desc: "使装备者的基础速度提高#1[i]点。对我方其他单体施放战技时，获得#2[i]个笑点，该效果每#3[i]回合最多触发1次，随后使我方全体在本场战斗中造成伤害时无视敌方目标#4[i]%的防御力，该效果无法叠加。",

  var SIGNATURE_LIGHTCONE = { "1501": "23053", "1503": "23055", "1506": "23057", "1511": "23065" };

  function num(v, d) { var n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : d; }

  function r3(v) { return Math.round(num(v, 0) * 1000) / 1000; }
  function meta(id) { for (var i = 0; i < CHARS.length; i++) { if (CHARS[i].id === id) return CHARS[i]; } return { id: id, name: id }; }
  function charOf(cfg, id) { return (cfg.characters && cfg.characters[id]) || {}; }
  function nameOf(id) { return meta(id).name; }

  /* ---- v1.2.0 光锥 API（结构遵循 ENGINE_API.md，供预览模式使用） ---- */
  function resolveLightcone(id, cc) {
    var conf = (cc && cc.lightcone) || {};
    var lcId = conf.id === undefined || conf.id === null ? SIGNATURE_LIGHTCONE[id] : String(conf.id);
    if (!lcId || lcId === "none" || conf.enabled === false) return null;
    var data = LIGHTCONES[lcId];
    if (!data) return null;
    var sp = Math.max(1, Math.min(5, num(conf.superimpose, 1)));
    return { id: lcId, name: data.name, passive: data.passive, desc: data.desc, rarity: data.rarity,
             path: data.path, superimpose: sp, params: data.levels[sp - 1] || data.levels[0] || [], stats: data.stats };
  }
  /* 固定属性先加、再乘百分比（与 engine/lightcones.js 一致）；返回加成明细 */
  function applyLightconeStats(stats, lc) {
    if (!lc) return null;
    var p = lc.params || [];
    var bonus = { hp: lc.stats.hp, atk: lc.stats.atk, def: lc.stats.def,
                  defPct: 0, critDmg: 0, spdFlat: 0, spdPct: 0, critRate: 0, elationDegree: 0 };
    if (lc.id === "23055") bonus.defPct = num(p[0], 0);
    if (lc.id === "23053") bonus.critDmg = num(p[0], 0);
    if (lc.id === "23057") bonus.spdPct = num(p[0], 0);
    if (lc.id === "23065") bonus.spdFlat = num(p[0], 0);
    stats.hp += bonus.hp; stats.atk += bonus.atk; stats.def += bonus.def;
    if (bonus.defPct) stats.def = stats.def * (1 + bonus.defPct);
    if (bonus.critDmg) stats.critDmg += bonus.critDmg;
    if (bonus.spdFlat) stats.spd += bonus.spdFlat;
    if (bonus.spdPct) stats.spd = stats.spd * (1 + bonus.spdPct);

  }
  function panelStatsOf(cfg, id) {

  }
  function lightconeInfo(id, cfg) {
    cfg = cfg || defaultConfig();
    var cur = resolveLightcone(id, charOf(cfg, id)), sigId = SIGNATURE_LIGHTCONE[id], data = LIGHTCONES[sigId];

    for (r = 1; r <= 6; r++) {

  }

    for (r = 1; r <= num(eidolon, 0); r++) { if (bonus[r] && bonus[r][slot]) lv += bonus[r][slot]; }

  function dmgOf(cfg, id, mult, kind, jokeNow) {
    var c = charOf(cfg, id), st = panelStatsOf(cfg, id), opt = cfg.options || {}, enemy = cfg.enemy || {};
    var lv = num(c.level, 80);
    var def = num(enemy.defenseBase, 200) + num(enemy.defensePerLevel, 10) * num(enemy.level, 80);
    var defMult = (lv + 20) / ((lv + 20) + def);
    var resMult = Math.max(0.1, 1 - ((enemy.weakness ? 0 : num(enemy.resBase, 0.2)) - num(enemy.resShred, 0)));
    var vulnMult = 1 + num(enemy.vulnerability, 0);
    var toughMult = enemy.broken ? 1 : (1 - num(enemy.toughnessDR, 0));
    var critMult = opt.alwaysCrit ? (1 + num(st.critDmg, 0.5)) : (1 + num(st.critRate, 0.05) * num(st.critDmg, 0.5));

      core = num(opt.elationBaseValue, 7535.107) * mult * (1 + num(st.elationDegree, 0)) * jm;

  function simulate(cfg) {

        byType[k] += num(list[i].damage, 0);

    }

    ids.forEach(function (id) {

      (unit ? '<i class="unit">' + U.esc(unit) + '</i>' : '') + '</span></div>';
    var ctl = "", hasRange = false;
    if (type === "boolean") {
      ctl = '<label class="switch"><input type="checkbox" data-path="' + U.esc(path) + '" data-kind="boolean"' +
        (value ? ' checked' : '') + ' aria-label="' + U.esc(label) + '"><span class="track"><span class="thumb"></span></span>' +
        '<span class="muted">' + (value ? "开启" : "关闭") + '</span></label>';
    } else if (type === "select") {
      ctl = '<select data-path="' + U.esc(path) + '" data-kind="select" aria-label="' + U.esc(label) + '">' +
        (f.options || []).map(function (o) {
          var ov = U.isObj(o) ? o.value : o;
          var ol = U.isObj(o) && o.label !== undefined ? o.label : ov;
          return '<option value="' + U.esc(String(ov)) + '"' + (String(ov) === String(value) ? ' selected' : '') + '>' + U.esc(String(ol)) + '</option>';
        }).join("") + '</select>';
    } else if (type === "number") {
      hasRange = typeof f.min === "number" && typeof f.max === "number" && f.max > f.min;
      var attrs = (typeof f.min === "number" ? ' min="' + f.min + '"' : '') +
        (typeof f.max === "number" ? ' max="' + f.max + '"' : '') +
        ' step="' + (typeof f.step === "number" && f.step > 0 ? f.step : "any") + '"';
      ctl = (hasRange ? '<input type="range" class="slider" data-path="' + U.esc(path) + '" data-kind="number"' + attrs +
        ' value="' + U.esc(String(value)) + '" aria-label="' + U.esc(label) + '">' : '') +
        '<input type="number" class="numbox" data-path="' + U.esc(path) + '" data-kind="number"' + attrs +
        ' value="' + U.esc(String(value)) + '" aria-label="' + U.esc(label) + '">';
    } else {
      ctl = '<input type="text" data-path="' + U.esc(path) + '" data-kind="text" value="' + U.esc(String(value === undefined || value === null ? "" : value)) + '" aria-label="' + U.esc(label) + '">';
    }
    return '<div class="field' + (type === "number" && !hasRange ? " no-slider" : "") + '" data-field="' + U.esc(path) + '">' +
      head + '<div class="fctl">' + ctl + '</div>' +
      (help ? '<div class="fhelp">' + U.esc(help) + '</div>' : '') + '</div>';
  }

  UI.renderParams = function () {
    var host = U.el("params");
    if (!host) return;
    /* 保留折叠状态 */
    var openNodes = host.querySelectorAll("details[data-group]"), i;
    for (i = 0; i < openNodes.length; i++) {
      UI.state.openGroups[openNodes[i].getAttribute("data-group")] = openNodes[i].open;
    }
    var groups = (UI.state.schema && UI.state.schema.groups) || [];
    if (!groups.length) {
      host.innerHTML = '<div class="card"><div class="cardbody muted">Schema 未提供任何参数分组。</div></div>';
      return;
    }
    host.innerHTML = groups.map(function (g) {
      var open = !!UI.state.openGroups[g.id];
      /* 角色卡片：星魂 / 技能等级字段从主列表移出，改由下方专属子区块渲染 */
      var isChar = !!(UI.charPanels && UI.charPanels.isCharGroup(g));
      var fields = isChar ? g.fields.filter(function (f) { return !UI.charPanels.isPanelField(f.path); }) : g.fields;
      var fieldCount = g.fields.length;
      var missing = g.fields.filter(function (f) { return U.getByPath(UI.state.config, f.path) === undefined && f["default"] === undefined; }).length;
      return '<details class="card group" data-group="' + U.esc(g.id) + '"' + (open ? ' open' : '') + '>' +
        '<summary><span class="gtitle">' + U.esc(g.label) + '</span>' +
        '<span class="gmeta">' + fieldCount + ' 项' + (missing ? ' · ' + missing + ' 项无默认值' : '') + '</span></summary>' +
        '<div class="group-body">' +
        (g.description ? '<p class="gdesc">' + U.esc(g.description) + '</p>' : '') +
        fields.map(fieldHTML).join("") +
        (isChar ? UI.charPanels.blockHTML(g) : "") +
        '</div></details>';
    }).join("");
  };

  function readValue(field, el) {
    var kind = field ? field.type : (el.getAttribute("data-kind") || "text");
    if (kind === "boolean") return !!el.checked;
    if (kind === "select") {
      var opts = (field && field.options) || [], i;
      for (i = 0; i < opts.length; i++) {
        var o = opts[i], ov = U.isObj(o) ? o.value : o;
        if (String(ov) === el.value) return ov;
      }
      return el.value;
    }
    if (kind === "number") {
      var n = parseFloat(el.value);
      return isFinite(n) ? n : undefined; /* 输入中间态（空串 / 负号）不写入配置 */
    }
    return el.value;
  }

  function refreshFieldBox(box, path, field) {
    if (!box) return;
    var badge = box.querySelector("[data-valfor]");
    if (badge) badge.textContent = UI.displayValue(field || { type: "text" }, U.getByPath(UI.state.config, path));
    var sw = box.querySelector(".switch .muted");
    if (sw && field && field.type === "boolean") sw.textContent = U.getByPath(UI.state.config, path) ? "开启" : "关闭";
  }

  function onFieldEvent(ev) {
    var el = ev.target;
    if (!el || typeof el.getAttribute !== "function") return;
    var path = el.getAttribute("data-path");
    if (!path) return;
    var field = UI.fieldByPath[path];
    var value = readValue(field, el);
    var box = el.closest ? el.closest(".field") : null;
    if (value === undefined) return;
    U.setByPath(UI.state.config, path, value);
    if (box) {
      var peers = box.querySelectorAll("[data-path]"), i;
      for (i = 0; i < peers.length; i++) {
        var p = peers[i];
        if (p === el) continue;
        if (p.type === "number" || p.type === "range") { if (String(p.value) !== String(el.value)) p.value = el.value; }
      }
    }
    refreshFieldBox(box, path, field);
    if (UI.charPanels) UI.charPanels.onFieldChanged(path);
    UI.scheduleRun();
  }

  function onFieldCommit(ev) {
    var el = ev.target;
    if (!el || typeof el.getAttribute !== "function") return;
    var path = el.getAttribute("data-path");
    if (!path) return;
    var field = UI.fieldByPath[path];
    if (!field || field.type !== "number") return;
    var box = el.closest ? el.closest(".field") : null;
    var n = parseFloat(el.value);
    if (!isFinite(n)) {
      n = U.num(field["default"], 0);
    }
    if (typeof field.min === "number" && n < field.min) n = field.min;
    if (typeof field.max === "number" && n > field.max) n = field.max;
    U.setByPath(UI.state.config, path, n);
    if (box) {
      var peers = box.querySelectorAll("[data-path]"), i;
      for (i = 0; i < peers.length; i++) peers[i].value = String(n);
    }
    refreshFieldBox(box, path, field);
    if (UI.charPanels) UI.charPanels.onFieldChanged(path);
    UI.scheduleRun();
  }

  UI.bindParams = function () {
    var host = U.el("params");
    if (!host) return;
    host.addEventListener("input", onFieldEvent);
    host.addEventListener("change", function (ev) {
      onFieldCommit(ev);
      onFieldEvent(ev);
    });
  };
})(window.HSRUI = window.HSRUI || {});
</script>

<script>
/* =====================================================================
   模块 2.5：星魂 / 技能等级面板（ENGINE_API v1.1.0）
   - 星魂：schema 的 eidolon select（0–6 魂）置于区块顶部 + 6 条星魂列表，
           解锁状态随配置实时刷新（未解锁灰显 + 锁图标 + 删除线）
   - 技能等级：基础等级输入 + 星魂加成后的实际等级小表格
   ===================================================================== */
(function (UI) {
  "use strict";
  var U = UI.util;

  var FALLBACK_LABELS = { basic: "普攻", skill: "战技", ult: "终结技", talent: "天赋",
                          elationSkill: "欢愉技", innate: "固有行迹", maze: "秘技" };
  var SLOT_ORDER = { basic: 0, skill: 1, ult: 2, talent: 3, elationSkill: 4, innate: 5, maze: 6 };
  var cachedConst = null;

  function K() {
    if (!cachedConst) cachedConst = UI.engine.constants();
    return cachedConst;
  }
  function num(v, d) { return U.num(v, d); }
  function slotLabel(slot) {
    var labels = K().SLOT_LABELS || {};
    return labels[slot] || FALLBACK_LABELS[slot] || slot;
  }
  function slotCap(slot) { return num((K().SLOT_CAPS || {})[slot], 15); }
  function q(sel) {
    var host = U.el("params");
    return (host && host.querySelectorAll) ? host.querySelectorAll(sel) : [];
  }
  function isFocused(el) {
    try { return !!document.activeElement && document.activeElement === el; } catch (e) { return false; }
  }

  function charIdOf(g) {
    if (!g || g.id === undefined || g.id === null) return null;
    var id = String(g.id);
    return U.isObj(U.getByPath(UI.state.config, "characters." + id)) ? id : null;
  }
  function configEidolon(id) {
    return num(U.getByPath(UI.state.config, "characters." + id + ".eidolon"), 0);
  }
  /* 星魂加成明细：{ sum, src } —— 数据来自引擎 EIDOLON_SKILL_BONUS */
  function eidolonBonus(id, slot, eidolon) {
    var table = (K().EIDOLON_SKILL_BONUS || {})[id] || {}, sum = 0, src = [], r;
    for (r = 1; r <= num(eidolon, 0); r++) {
      if (table[r] && table[r][slot]) { sum += table[r][slot]; src.push("E" + r + " +" + table[r][slot]); }
    }
    return { sum: sum, src: src.join("，") };
  }

  /* ---------------- 星魂下拉字段 ---------------- */
  function eidolonOptionsFromEngine(id) {
    var fn = UI.engine.pick("eidolonInfo"), list = [], i;
    if (fn) { try { list = fn(id, 0) || []; } catch (e) { list = []; } }
    var opts = [{ value: 0, label: "0 魂（未解锁）" }];
    for (i = 0; i < list.length; i++) {
      var e = list[i] || {}, rank = num(e.rank, i + 1);
      var summary = e.type === "skillLevel"
        ? (e.skillEffect ? "（" + e.skillEffect + "）" : "（技能等级）")
        : "（机制）";
      opts.push({ value: rank, label: rank + " 魂 · " + (e.name || ("星魂 " + rank)) + summary });
    }
    while (opts.length < 7) opts.push({ value: opts.length, label: opts.length + " 魂" });
    return opts;
  }
  function eidolonField(id) {
    var path = "characters." + id + ".eidolon";
    var f = UI.fieldByPath[path];
    if (!f || f.type !== "select" || !(f.options && f.options.length)) {
      f = {
        path: path, label: "星魂解锁等级", type: "select", options: eidolonOptionsFromEngine(id),
        help: "选择已解锁的星魂等级；3、5 魂提升技能等级，其余为机制质变", "default": 0
      };
      UI.fieldByPath[path] = f;
    }
    return f;
  }
  function eidolonPickHTML(id) {
    var f = eidolonField(id), cur = configEidolon(id);
    var opts = (f.options || []).map(function (o) {
      var ov = U.isObj(o) ? o.value : o, ol = (U.isObj(o) && o.label !== undefined) ? o.label : ov;
      return '<option value="' + U.esc(String(ov)) + '"' + (String(ov) === String(cur) ? " selected" : "") + '>' +
        U.esc(String(ol)) + '</option>';
    }).join("");
    return '<div class="field eido-pick" data-field="' + U.esc(f.path) + '">' +
      '<div class="fhead"><span class="flabel" title="' + U.esc(f.help || f.label) + '">' + U.esc(f.label || "星魂解锁等级") + '</span>' +
      '<span class="fval"><b class="eido-chip' + (cur ? "" : " zero") + '" data-eido-chip="' + U.esc(id) + '">E' + cur + '</b></span></div>' +
      '<div class="fctl"><select data-path="' + U.esc(f.path) + '" data-kind="select" aria-label="' + U.esc(f.label || "星魂解锁等级") + '">' +
      opts + '</select></div>' +
      (f.help ? '<div class="fhelp">' + U.esc(f.help) + '</div>' : '') + '</div>';
  }

  /* ---------------- 星魂列表 ---------------- */
  function eidolonItemHTML(e) {
    var unlocked = !!e.unlocked, rank = num(e.rank, 0);
    var isSkill = e.type === "skillLevel";
    var desc = String(e.desc || "");
    var descHTML = "";
    if (desc) {
      descHTML = desc.length > 72
        ? '<details class="eido-desc"><summary><span class="eido-toggle">效果原文</span>' +
          '<span class="eido-peek">' + U.esc(desc.slice(0, 72)) + '…</span></summary>' +
          '<div class="eido-text">' + U.esc(desc) + '</div></details>'
        : '<div class="eido-text">' + U.esc(desc) + '</div>';
    }
    var effHTML = (isSkill && e.skillEffect) ? '<div class="eido-eff">' + U.esc(e.skillEffect) + '</div>' : "";
    return '<div class="eido-item ' + (unlocked ? "unlocked" : "locked") + '" data-eido-item="' + rank + '">' +
      '<div class="eido-rank">E' + rank + '</div>' +
      '<div class="eido-body"><div class="eido-top">' +
      '<span class="eido-name" title="' + U.esc(e.name || ("星魂 " + rank)) + '">' + U.esc(e.name || ("星魂 " + rank)) + '</span>' +
      '<span class="eido-type' + (isSkill ? " skill" : "") + '">' + (isSkill ? "技能等级" : "机制") + '</span>' +
      '<span class="eido-state">' + (unlocked ? "✔ 已解锁" : "🔒 未解锁") + '</span>' +
      '</div>' + effHTML + descHTML + '</div></div>';
  }
  function eidolonListHTML(id) {
    var info = UI.engine.characterInfo(id, UI.state.config);
    if (!info) {
      return '<div class="muted">引擎未提供 characterInfo()，无法显示星魂数据（请重新构建页面以内联 v1.1.0 引擎）。</div>';
    }
    var cur = num(info.eidolon, 0);
    var items = info.eidolons.map(eidolonItemHTML).join("");
    if (!items) return '<div class="muted">该角色暂无星魂数据。</div>';
    var note = cur >= 6 ? "满星魂：技能等级加成全部生效"
      : cur >= 5 ? "已解锁 E5，技能等级加成已生效"
      : cur >= 3 ? "已解锁 E3，技能等级加成已生效"
      : "未获得 3/5 魂的技能等级加成";
    return '<div class="eido-sum">当前 <b>E' + cur + '</b> / 6 · ' + U.esc(note) + '</div>' +
      '<div class="eido-items">' + items + '</div>';
  }

  /* ---------------- 技能等级表格 ---------------- */
  function skillRows(id) {
    var info = UI.engine.characterInfo(id, UI.state.config);
    var rows = [], seen = {};
    if (info) {
      info.skillLevels.forEach(function (s) {
        var path = "characters." + id + ".skillLevels." + s.slot;
        if (!UI.fieldByPath[path] || seen[s.slot]) return;
        seen[s.slot] = 1;
        rows.push({ slot: s.slot, label: s.label || slotLabel(s.slot), name: s.name, base: s.base, level: s.level, cap: s.cap, path: path });
      });
    }
    /* 引擎未给出该角色信息时，按 schema 字段兜底 */
    Object.keys(UI.fieldByPath).forEach(function (path) {
      var m = /^characters\.([^.]+)\.skillLevels\.([^.]+)$/.exec(path);
      if (!m || m[1] !== id || seen[m[2]]) return;
      var f = UI.fieldByPath[path];
      var base = num(U.getByPath(UI.state.config, path), num(f["default"], 0));
      seen[m[2]] = 1;
      rows.push({ slot: m[2], label: f.label || slotLabel(m[2]), name: "", base: base, level: base,
                  cap: num(f.max, slotCap(m[2])), path: path });
    });
    rows.sort(function (a, b) {
      var oa = SLOT_ORDER[a.slot] === undefined ? 99 : SLOT_ORDER[a.slot];
      var ob = SLOT_ORDER[b.slot] === undefined ? 99 : SLOT_ORDER[b.slot];
      return oa - ob;
    });
    return rows;
  }
  function levelCellsHTML(base, level, cap) {
    var b = num(base, 0), l = num(level, 0), c = num(cap, 15);
    if (l > b) {
      return '<span class="sk-base">' + b + '</span><span class="sk-arrow">→</span>' +
        '<b class="sk-now">' + l + '</b><span class="sk-cap-slash muted"> / ' + c + '</span>';
    }
    return '<b class="sk-now">' + l + '</b><span class="sk-cap-slash muted"> / ' + c + '</span>';
  }
  function skillRowHTML(id, r) {
    var f = UI.fieldByPath[r.path] || {};
    var base = num(U.getByPath(UI.state.config, r.path), num(r.base, 0));
    var maxAttr = num(f.max, num(r.cap, 15)) || 15;
    var minAttr = num(f.min, 1);
    var step = num(f.step, 1) || 1;
    var info = UI.engine.characterInfo(id, UI.state.config);
    var rec = null, i;
    if (info) for (i = 0; i < info.skillLevels.length; i++) if (info.skillLevels[i].slot === r.slot) rec = info.skillLevels[i];
    var level = rec ? num(rec.level, base) : base;
    var cap = rec ? num(rec.cap, slotCap(r.slot)) : slotCap(r.slot);
    var bonus = eidolonBonus(id, r.slot, configEidolon(id));
    var title = bonus.src ? "星魂加成：" + bonus.src : (f.help || "");
    return '<tr data-skill-row="' + U.esc(id + ":" + r.slot) + '" data-slot="' + U.esc(r.slot) + '">' +
      '<td><span class="sk-title">' + U.esc(r.label || slotLabel(r.slot)) + '<i class="sk-slot">' + U.esc(r.slot) + '</i></span>' +
      (r.name ? '<span class="sk-subname" title="' + U.esc(r.name) + '">' + U.esc(r.name) + '</span>' : '') + '</td>' +
      '<td class="num"><input type="number" class="sk-input" data-path="' + U.esc(r.path) + '" data-kind="number"' +
      ' min="' + minAttr + '" max="' + maxAttr + '" step="' + step + '" value="' + U.esc(String(base)) + '"' +
      ' aria-label="' + U.esc((r.label || r.slot) + "基础等级") + '"></td>' +
      '<td class="num sk-lv' + (level > base ? " boosted" : "") + '" data-skill-level="' + U.esc(id + ":" + r.slot) + '"' +
      (title ? ' title="' + U.esc(title) + '"' : '') + '>' + levelCellsHTML(base, level, cap) + '</td>' +
      '<td class="num sk-cap"><b>' + maxAttr + '</b><i>满星魂 ' + cap + '</i></td>' +
      '</tr>';
  }
  function skillNoteHTML(id) {
    var info = UI.engine.characterInfo(id, UI.state.config);
    var innate = info ? num(info.innateLevel, 0) : 0;
    return '上限 X（满星魂 Y）：基础等级输入框受 0 魂上限约束，星魂 3/5 加成后受 <b>满星魂上限</b>约束。' +
      (innate ? ' 当前固有行迹等级 <b>Lv' + innate + '</b>（阿哈 2 魂时为 2 级）。' : '');
  }
  function skillBlockHTML(id) {
    var rows = skillRows(id);
    var body = rows.length
      ? rows.map(function (r) { return skillRowHTML(id, r); }).join("")
      : '<tr><td colspan="4" class="muted">该角色没有可调整的技能等级字段。</td></tr>';
    return '<section class="subblock skill-block" data-char="' + U.esc(id) + '">' +
      '<div class="subhead"><h3>技能等级</h3><span class="muted">等级 = 基础 + 星魂 3/5 加成</span></div>' +
      '<div class="subbody"><table class="skill-table"><thead><tr>' +
      '<th>技能</th><th class="num">基础</th><th class="num">等级</th><th class="num">上限</th>' +
      '</tr></thead><tbody data-skill-body="' + U.esc(id) + '">' + body + '</tbody></table>' +
      '<p class="sk-note" data-skill-note="' + U.esc(id) + '">' + skillNoteHTML(id) + '</p>' +
      '</div></section>';
  }

  /* ---------------- 对外：渲染 / 局部刷新 ---------------- */
  function eidolonBlockHTML(id) {
    return '<section class="subblock eido-block" data-char="' + U.esc(id) + '">' +
      '<div class="subhead"><h3>星魂</h3><span class="muted">0–6 魂 · 3/5 魂提升技能等级</span></div>' +
      '<div class="subbody">' + eidolonPickHTML(id) +
      '<div class="eido-list" data-eido-list="' + U.esc(id) + '">' + eidolonListHTML(id) + '</div>' +
      '</div></section>';
  }

  function refreshSkillRows(id, info) {
    if (!info) info = UI.engine.characterInfo(id, UI.state.config);

    for (i = 0; i < rows.length; i++) {
      var key = String(rows[i].getAttribute("data-skill-row") || "");
      if (key.indexOf(id + ":") !== 0) continue;
      var slot = key.slice(id.length + 1);
      var path = "characters." + id + ".skillLevels." + slot;
      var f = UI.fieldByPath[path] || {};
      var rec = null, j;
      if (info) for (j = 0; j < info.skillLevels.length; j++) if (info.skillLevels[j].slot === slot) rec = info.skillLevels[j];
      var base = num(U.getByPath(UI.state.config, path), rec ? rec.base : num(f["default"], 0));
      var level = rec ? num(rec.level, base) : base;
      var cap = rec ? num(rec.cap, slotCap(slot)) : slotCap(slot);
      var input = rows[i].querySelector ? rows[i].querySelector("input[data-path]") : null;
      if (input && !isFocused(input)) input.value = String(base);
      var cell = rows[i].querySelector ? rows[i].querySelector("[data-skill-level]") : null;
      if (cell) {
        cell.innerHTML = levelCellsHTML(base, level, cap);
        cell.className = "num sk-lv" + (level > base ? " boosted" : "");
        var bonus = eidolonBonus(id, slot, configEidolon(id));
        var title = bonus.src ? "星魂加成：" + bonus.src : (f.help || "");
        if (title) cell.setAttribute("title", title); else cell.removeAttribute("title");
      }
    }
  }
  function refreshChar(id) {
    var info = UI.engine.characterInfo(id, UI.state.config);
    var lists = q('[data-eido-list="' + id + '"]'), i;
    for (i = 0; i < lists.length; i++) lists[i].innerHTML = eidolonListHTML(id);
    var cur = info ? num(info.eidolon, 0) : configEidolon(id);
    var chips = q('[data-eido-chip="' + id + '"]');
    for (i = 0; i < chips.length; i++) {
      chips[i].textContent = "E" + cur;
      chips[i].className = "eido-chip" + (cur ? "" : " zero");
    }
    var notes = q('[data-skill-note="' + id + '"]');
    for (i = 0; i < notes.length; i++) notes[i].innerHTML = skillNoteHTML(id);
    refreshSkillRows(id, info);
    if (UI.lcPanel) UI.lcPanel.refresh(id); /* v1.2.0：同步刷新光锥区块与面板对比表 */
  }

  UI.charPanels = {
    isCharGroup: function (g) { return !!charIdOf(g); },
    /* 从常规字段列表移出的字段：星魂 / 技能等级 / 光锥开关与叠影（改由专属子区块渲染） */
    isPanelField: function (path) {
      var p = String(path);
      if (/\.eidolon$/.test(p) || /\.skillLevels\.[^.]+$/.test(p)) return true;
      return !!(UI.lcPanel && UI.lcPanel.isPanelField(p));
    },
    blockHTML: function (g) {
      var id = charIdOf(g);
      if (!id) return "";
      /* 顺序：星魂 → 光锥（v1.2.0）→ 技能等级 */
      return eidolonBlockHTML(id) + (UI.lcPanel ? UI.lcPanel.blockHTML(id) : "") + skillBlockHTML(id);
    },
    onFieldChanged: function (path) {
      var p = String(path || "");
      var m = /^characters\.([^.]+)\.((?:eidolon)|(?:skillLevels\.[^.]+))$/.exec(p);
      if (!m) {
        var lm = /^characters\.([^.]+)\.lightcone\.(?:enabled|superimpose)$/.exec(p);
        if (lm && UI.lcPanel) UI.lcPanel.refresh(lm[1]);
        return;
      }
      if (m[1] === "1511") UI.charPanels.refreshAll(); /* 阿哈 2 魂影响全队固有行迹等级 */
      else refreshChar(m[1]);
    },
    refreshAll: function () {
      var chars = (UI.state.config && UI.state.config.characters) || {};
      Object.keys(chars).forEach(refreshChar);
    },
    refresh: refreshChar
  };
})(window.HSRUI = window.HSRUI || {});
</script>

<script>
/* =====================================================================
   模块 2.6：专属光锥面板（ENGINE_API v1.2.0）
   - 顶部一行：装备开关 + 光锥名称（5★ 标记）+ 被动名 + 叠影下拉
   - 效果原文：desc 里的 #1[i] 占位符按当前叠影参数填充，长文本可折叠，未装备时灰显
   - 满级属性：攻 / 生 / 防（来自 options[0].stats）
   - 面板属性对比：baseStats → panelStats（攻 / 生 / 防 / 速度 / 暴伤），提升单元格用强调色
   ===================================================================== */
(function (UI) {
  "use strict";
  var U = UI.util;

  /* 对比行：flat 固定值 / spd 速度（变化按百分比标注）/ pct 百分比属性（暴伤） */
  var STAT_ROWS = [
    { key: "atk", label: "攻击力", kind: "flat", digits: 1 },
    { key: "hp", label: "生命值", kind: "flat", digits: 1 },
    { key: "def", label: "防御力", kind: "flat", digits: 1 },
    { key: "spd", label: "速度", kind: "spd", digits: 2 },
    { key: "critDmg", label: "暴击伤害", kind: "pct", digits: 1 }
  ];
  var SUP_OPTIONS = [1, 2, 3, 4, 5];

  function num(v, d) { return U.num(v, d); }
  function q(sel) {
    var host = U.el("params");
    return (host && host.querySelectorAll) ? host.querySelectorAll(sel) : [];
  }
  function isFocused(el) {
    try { return !!document.activeElement && document.activeElement === el; } catch (e) { return false; }
  }
  function trimZeros(s) { return String(s).indexOf(".") < 0 ? String(s) : String(s).replace(/0+$/, "").replace(/\.$/, ""); }
  function fixed(v, digits) { return trimZeros(num(v, 0).toFixed(digits === undefined ? 1 : digits)); }
  function pctOf(v, digits) { return trimZeros((num(v, 0) * 100).toFixed(digits === undefined ? 1 : digits)) + "%"; }

  function lcConf(id) {
    var c = U.getByPath(UI.state.config, "characters." + id);
    return (U.isObj(c) && U.isObj(c.lightcone)) ? c.lightcone : {};
  }
  function isEnabled(id) { return lcConf(id).enabled !== false; }
  function superPos(id) {
    var sp = Math.round(num(lcConf(id).superimpose, 1));
    return Math.max(1, Math.min(5, sp || 1));
  }
  function infoOf(id) { return UI.engine.characterInfo(id, UI.state.config); }
  function sigOption(lc) {
    if (!lc || !lc.options || !lc.options.length) return null;
    var i;
    for (i = 0; i < lc.options.length; i++) if (lc.options[i].signature) return lc.options[i];
    for (i = 0; i < lc.options.length; i++) if (lc.options[i].id !== "none") return lc.options[i];
    return lc.options[0];
  }
  /* 当前叠影下的参数：优先引擎光锥表的 levels[]，其次引擎给的 options[].params */
  function paramsOf(id, option, sp) {
    var table = UI.engine.constant("LIGHTCONES") || {};
    var sig = UI.engine.constant("SIGNATURE_LIGHTCONE") || {};
    var entry = table[sig[id] || (option && option.id)];
    if (entry && entry.levels && entry.levels.length) {
      return entry.levels[Math.max(0, Math.min(entry.levels.length - 1, num(sp, 1) - 1))] || entry.levels[0];
    }
    return (option && option.params && option.params.length) ? option.params : null;
  }
  /* desc 占位符 #1[i] / #6[f1] → 实际数值；紧随其后的 % 视为百分比 */
  function fillDesc(desc, params) {
    var text = String(desc || "");
    if (!text || !params || !params.length) return text;
    return text.replace(/#(\d+)\[([if])(\d*)\]/g, function (m, n, kind, digits, offset, whole) {
      var v = params[num(n, 0) - 1];
      if (typeof v !== "number" || !isFinite(v)) return m;
      var x = String(whole).charAt(offset + m.length) === "%" ? v * 100 : v;
      return kind === "f" ? x.toFixed(num(digits, 1)) : String(Math.round(x));
    });
  }

  /* ---------------- 面板属性对比小表 ---------------- */
  function cellText(row, v) {
    if (row.kind === "pct") return pctOf(v, row.digits);
    return fixed(v, row.kind === "spd" ? 2 : row.digits);
  }
  function compareHTML(info) {
    var lc = info ? info.lightcone : null;
    if (!(lc && lc.current && lc.current !== "none")) return '<div class="lc-empty">未装备光锥，面板不含光锥属性</div>';
    var base = info.baseStats, panel = info.panelStats;
    if (!base || !panel) return '<div class="lc-empty">引擎未提供 baseStats / panelStats，无法对比面板属性。</div>';
    var rows = STAT_ROWS.map(function (r) {
      var b = num(base[r.key], 0), p = num(panel[r.key], 0);
      var up = p > b + 1e-9, delta;
      if (!up) delta = '<span class="lc-delta">±0</span>';
      else if (r.kind === "spd") delta = '<span class="lc-delta up">+' + pctOf(b > 0 ? (p / b - 1) : 0, 1) + '</span>';
      else if (r.kind === "pct") delta = '<span class="lc-delta up">+' + pctOf(p - b, r.digits) + '</span>';
      else delta = '<span class="lc-delta up">+' + fixed(p - b, r.digits) + '</span>';
      return '<tr data-lc-stat="' + U.esc(r.key) + '">' +
        '<td>' + U.esc(r.label) + '</td>' +
        '<td class="num lc-base">' + U.esc(cellText(r, b)) + '</td>' +
        '<td class="num"><span class="lc-arrow">→</span><b class="lc-now' + (up ? " up" : "") + '">' + U.esc(cellText(r, p)) + '</b></td>' +
        '<td class="num">' + delta + '</td></tr>';
    }).join("");
    return '<table class="lc-table" title="右侧为「角色 + 光锥 + 遗器」的最终面板"><thead><tr><th>面板属性</th><th class="num">仅角色</th>' +
      '<th class="num">含光锥+遗器</th><th class="num">提升</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  /* ---------------- 并入面板的加成明细 ---------------- */
  function bonusHTML(bonus) {
    if (!U.isObj(bonus)) return "";
    var parts = [];
    if (num(bonus.atk, 0)) parts.push("攻 +" + fixed(bonus.atk, 1));
    if (num(bonus.hp, 0)) parts.push("生 +" + fixed(bonus.hp, 1));
    if (num(bonus.def, 0)) parts.push("防 +" + fixed(bonus.def, 1));
    if (num(bonus.defPct, 0)) parts.push("防御 +" + pctOf(bonus.defPct, 0));
    if (num(bonus.critDmg, 0)) parts.push("暴伤 +" + pctOf(bonus.critDmg, 0));
    if (num(bonus.spdPct, 0)) parts.push("速度 +" + pctOf(bonus.spdPct, 0));
    if (num(bonus.spdFlat, 0)) parts.push("基础速度 +" + fixed(bonus.spdFlat, 0));
    if (!parts.length) return "";
    return '<p class="lc-bonus">并入面板：' + U.esc(parts.join(" · ")) + '</p>';
  }

  /* ---------------- 数据区（随开关 / 叠影变化的部分） ---------------- */
  function dynamicHTML(id, info) {
    var lc = (info && U.isObj(info.lightcone)) ? info.lightcone : null;
    if (!info || !lc) return '<div class="lc-empty">引擎未提供 characterInfo().lightcone（请重新构建页面以内联 v1.2.0 引擎）。</div>';
    var sig = sigOption(lc);
    if (!sig) return '<div class="lc-empty">该角色暂无专属光锥数据。</div>';
    var on = lc.current !== "none", sp = superPos(id);
    var desc = fillDesc(sig.desc, paramsOf(id, sig, sp));
    var descHTML;
    if (!desc) descHTML = '<div class="lc-desc muted">该光锥暂无效果原文。</div>';
    else if (desc.length > 80) {
      descHTML = '<details class="lc-descbox"><summary><span class="lc-toggle">效果原文</span>' +
        '<span class="lc-peek">' + U.esc(desc.slice(0, 72)) + '…</span></summary>' +
        '<div class="lc-desc">' + U.esc(desc) + '</div></details>';
    } else descHTML = '<div class="lc-desc">' + U.esc(desc) + '</div>';
    var st = sig.stats || {};
    var statsHTML = '<div class="lc-stats"><span class="lc-tag">满级属性</span>' +
      '攻 <b>' + fixed(st.atk, 1) + '</b> / 生 <b>' + fixed(st.hp, 1) + '</b> / 防 <b>' + fixed(st.def, 1) + '</b>' +
      '<span class="lc-tag">' + (on ? "叠影 S" + sp : "未装备") + '</span></div>';
    return descHTML + statsHTML + (on ? bonusHTML(info.lightconeBonus) : "") +
      '<div class="lc-compare">' + compareHTML(info) + '</div>';
  }

  /* ---------------- 区块 ---------------- */
  function supOptionsHTML(cur) {
    return SUP_OPTIONS.map(function (n) {
      return '<option value="' + n + '"' + (n === cur ? " selected" : "") + '>叠影 ' + n + '</option>';
    }).join("");
  }
  function blockHTML(id) {
    var on = isEnabled(id), info = infoOf(id), lc = (info && U.isObj(info.lightcone)) ? info.lightcone : null;
    var sig = lc ? sigOption(lc) : null;
    var sp = superPos(id);
    var name = (sig && sig.name) ? sig.name : "专属光锥";
    var passive = (sig && sig.passive) ? sig.passive : "";
    var rarity = sig ? num(sig.rarity, 5) : 5;
    var enabledPath = "characters." + id + ".lightcone.enabled";
    var supPath = "characters." + id + ".lightcone.superimpose";
    var head = '<div class="lc-topline">' +
      '<div class="field lc-top" data-field="' + U.esc(enabledPath) + '">' +
      '<label class="switch" title="装备 / 卸下专属光锥"><input type="checkbox" data-path="' + U.esc(enabledPath) + '" data-kind="boolean"' +
      (on ? " checked" : "") + ' aria-label="装备专属光锥"><span class="track"><span class="thumb"></span></span></label>' +
      '<span class="lc-name" title="' + U.esc(name) + '">' + U.esc(name) + '</span>' +
      '<i class="lc-star">' + U.esc(String(rarity)) + '★</i>' +
      (passive ? '<span class="lc-passive">' + U.esc(passive) + '</span>' : "") +
      '</div>' +
      '<div class="field lc-sup" data-field="' + U.esc(supPath) + '">' +
      '<span class="lc-suplabel">叠影</span>' +
      '<select data-path="' + U.esc(supPath) + '" data-kind="select" data-lc-sup="' + U.esc(id) + '" aria-label="光锥叠影">' +
      supOptionsHTML(sp) + '</select>' +
      '<span class="fval"><b class="lc-chip' + (on ? "" : " zero") + '" data-lc-chip="' + U.esc(id) + '">' +
      (on ? "S" + sp : "未装备") + '</b></span>' +
      '</div></div>';
    return '<section class="subblock lc-block' + (on ? "" : " off") + '" data-char="' + U.esc(id) + '" data-lc-block="' + U.esc(id) + '">' +
      '<div class="subhead"><h3>专属光锥</h3><span class="muted">叠影 1–5 · 固定属性与被动一并并入面板</span></div>' +
      '<div class="subbody" data-lc-body="' + U.esc(id) + '">' + head +
      '<div data-lc-dynamic="' + U.esc(id) + '">' + dynamicHTML(id, info) + '</div>' +
      '</div></section>';
  }

  /* ---------------- 局部刷新（保留开关 / 下拉控件，避免打断交互） ---------------- */
  function refresh(id) {
    var info = infoOf(id), on = isEnabled(id), sp = superPos(id), i;
    var bodies = q('[data-lc-body="' + id + '"]');
    for (i = 0; i < bodies.length; i++) {
      var body = bodies[i];
      var host = body.querySelector ? body.querySelector("[data-lc-dynamic]") : null;
      if (host) host.innerHTML = dynamicHTML(id, info);
      else body.innerHTML = blockHTML(id);
      var chip = body.querySelector ? body.querySelector("[data-lc-chip]") : null;
      if (chip) { chip.textContent = on ? "S" + sp : "未装备"; chip.className = "lc-chip" + (on ? "" : " zero"); }
      var sel = body.querySelector ? body.querySelector("select[data-lc-sup]") : null;
      if (sel && !isFocused(sel)) sel.value = String(sp);
      var cb = body.querySelector ? body.querySelector('input[data-kind="boolean"]') : null;
      if (cb && !isFocused(cb)) cb.checked = on;
    }
    var blocks = q('[data-lc-block="' + id + '"]');
    for (i = 0; i < blocks.length; i++) blocks[i].className = "subblock lc-block" + (on ? "" : " off");
  }

  UI.lcPanel = {
    isPanelField: function (path) { return /^characters\.[^.]+\.lightcone\.(?:enabled|superimpose)$/.test(String(path)); },
    blockHTML: blockHTML,
    refresh: refresh,
    refreshAll: function () {
      var chars = (UI.state.config && UI.state.config.characters) || {};
      Object.keys(chars).forEach(refresh);
    }
  };
})(window.HSRUI = window.HSRUI || {});
</script>

<script>
/* =====================================================================
   模块 3：结果渲染（KPI / 占比 / 类型拆分 / 时间轴 / 资源曲线 / 警告）
   ===================================================================== */
(function (UI) {
  "use strict";
  var U = UI.util;

  var CHART_KEYS = [
    { k: "joke", label: "笑点", color: "#a78bfa" },
    { k: "hiddenScore", label: "隐藏分", color: "#2fe0c8" },
    { k: "fervor", label: "愿力", color: "#f59e0b" },
    { k: "sp", label: "战技点", color: "#38bdf8" }
  ];

  function fmtAxis(v) {
    var n = U.num(v, 0), a = Math.abs(n);
    if (a >= 1000) return (n / 1000).toFixed(a % 1000 === 0 ? 0 : 1) + "k";
    if (a >= 10) return String(Math.round(n));
    return String(Math.round(n * 10) / 10);
  }

  function kpiHTML(r) {
    var s = r.summary;
    var ids = UI.enabledIds();
    var items = [
      { label: "总伤害", value: U.fmtDamage(s.totalDamage), sub: "全部角色与伤害类型合计", cls: " accent" },
      { label: "DPS", value: U.fmtDamage(s.dps), sub: "总伤害 / " + U.fmtAV(s.durationAV) + " AV", cls: " violet" },
      { label: "模拟时长", value: U.fmtAV(s.durationAV) + " AV", sub: U.num(s.cycles, 0) + " 轮 · " + r.timeline.length + " 条行动", cls: "" },
      { label: "命中次数", value: U.fmtInt(s.hitCount), sub: "伤害结算段数（hits）", cls: "" },
      { label: "队伍人数", value: ids.length + " 人", sub: ids.length ? "已启用：" + ids.join(" / ") : "未启用任何角色", cls: "" }
    ];
    return '<div class="kpis">' + items.map(function (it) {
      return '<div class="kpi' + it.cls + '"><div class="k-label">' + U.esc(it.label) + '</div>' +
        '<div class="k-value">' + U.esc(it.value) + '</div><div class="k-sub">' + U.esc(it.sub) + '</div></div>';
    }).join("") + '</div>';
  }

  function shareHTML(r) {
    var rows = r.summary.byCharacter;
    if (!rows.length) return '<section class="card"><div class="cardhead"><h3>角色伤害占比</h3></div><div class="cardbody muted">无角色数据。</div></section>';
    var total = r.summary.totalDamage;
    var body = rows.slice().sort(function (a, b) { return b.damage - a.damage; }).map(function (c) {
      var share = total > 0 ? c.damage / total : U.num(c.share, 0);
      var w = Math.max(0, Math.min(100, share * 100));
      return '<div class="bar-row">' +
        '<div class="bar-name" title="' + U.esc(c.name) + '">' + U.esc(c.name) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + w.toFixed(2) + '%"></div></div>' +
        '<div class="bar-pct">' + U.esc(U.fmtPct(share)) + '</div>' +
        '<div class="bar-abs">' + U.esc(U.fmtDamage(c.damage)) + '</div>' +
        '</div>';
    }).join("");
    return '<section class="card"><div class="cardhead"><h3>角色伤害占比</h3><span class="muted">合计 ' + U.esc(U.fmtDamage(total)) + '</span></div>' +
      '<div class="cardbody bars">' + body + '</div></section>';
  }

  function typeHTML(r) {
    var total = r.summary.totalDamage;
    var tiles = r.summary.byType.map(function (t) {
      var share = total > 0 ? t.damage / total : 0;
      var color = U.typeColor(t.type);
      return '<div class="type"><div class="t-label"><i style="background:' + color + '"></i>' + U.esc(t.label || t.type) + '</div>' +
        '<div class="t-val">' + U.esc(U.fmtDamage(t.damage)) + '</div>' +
        '<div class="t-share">' + U.esc(U.fmtPct(share)) + ' · ' + U.esc(t.type) + '</div></div>';
    }).join("");
    return '<section class="card"><div class="cardhead"><h3>伤害类型拆分</h3><span class="muted">欢愉伤害不受增伤类效果影响</span></div>' +
      '<div class="cardbody typegrid">' + tiles + '</div></section>';
  }

  function rowKind(row) {
    var acc = {}, i;
    for (i = 0; i < row.hits.length; i++) {
      var k = row.hits[i].kind || "normal";
      acc[k] = (acc[k] || 0) + row.hits[i].damage;
    }
    var best = "", bestV = -1;
    Object.keys(acc).forEach(function (k) { if (acc[k] > bestV) { bestV = acc[k]; best = k; } });
    return best || "normal";
  }

  function hitsTitle(row) {
    if (!row.hits.length) return "";
    return row.hits.map(function (h) {
      return (h.skillName || h.skillId || "命中") + " ×" + h.multiplier + " → " + U.fmtDamage(h.damage) + (h.crit ? "（暴击）" : "");
    }).join("  |  ");
  }

  function timelineRows(r) {
    var rows = r.timeline.slice();
    if (UI.state.filter !== "all") rows = rows.filter(function (x) { return x.actorId === UI.state.filter; });
    var key = UI.state.sort.key, dir = UI.state.sort.dir === "desc" ? -1 : 1;
    var wrapped = rows.map(function (row, i) { return { row: row, i: i }; });
    wrapped.sort(function (a, b) {
      var x = a.row, y = b.row, res;
      if (key === "av" || key === "seq" || key === "damage") res = U.num(x[key], 0) - U.num(y[key], 0);
      else res = String(x[key] || "").localeCompare(String(y[key] || ""), "zh-Hans-CN");
      if (res === 0) res = a.i - b.i;
      return res * dir;
    });
    return wrapped.map(function (w) { return w.row; });
  }

  /* v1.2.0：hits[].sources 乘区来源（如「光锥·稳赢(无视防御) +20%」）以小标签展示 */
  function sourcesHTML(row) {
    var out = [], seen = {}, i, j;
    for (i = 0; i < row.hits.length; i++) {
      var list = row.hits[i].sources || [];
      for (j = 0; j < list.length; j++) {
        var s = String(list[j] || "");
        if (s && !seen[s]) { seen[s] = 1; out.push(s); }
      }
    }
    if (!out.length) return "";
    return '<details class="tl-src"><summary>乘区来源 · ' + out.length + ' 项</summary><div class="src-tags">' +
      out.map(function (s) { return '<span class="tag">' + U.esc(s) + '</span>'; }).join("") + '</div></details>';
  }

  function timelineHTML(r) {
    var actors = [], seen = {};
    r.timeline.forEach(function (row) {
      if (!seen[row.actorId]) { seen[row.actorId] = 1; actors.push({ id: row.actorId, name: row.actor }); }
    });
    var options = '<option value="all"' + (UI.state.filter === "all" ? " selected" : "") + '>全部角色</option>' +
      actors.map(function (a) {
        return '<option value="' + U.esc(a.id) + '"' + (UI.state.filter === a.id ? " selected" : "") + '>' + U.esc(a.name) + '</option>';
      }).join("");
    var rows = timelineRows(r);
    var cols = [
      { key: "seq", label: "seq", num: true },
      { key: "av", label: "AV", num: true },
      { key: "actor", label: "角色", num: false },
      { key: "action", label: "行动", num: false },
      { key: "", label: "说明", num: false },
      { key: "damage", label: "伤害", num: true }
    ];
    var head = cols.map(function (c) {
      if (!c.key) return '<th class="no-sort">' + U.esc(c.label) + '</th>';
      var active = UI.state.sort.key === c.key;
      var arrow = active ? (UI.state.sort.dir === "desc" ? " ▼" : " ▲") : "";
      return '<th data-sort="' + c.key + '" class="' + (c.num ? "num" : "") + '" title="点击排序">' + U.esc(c.label) + arrow + '</th>';
    }).join("");
    var body = rows.map(function (row) {
      var kind = rowKind(row);
      var desc = U.esc(row.description || "");
      if (row.note) desc += '<div class="muted">' + U.esc(row.note) + '</div>';
      desc += sourcesHTML(row);
      return '<tr>' +
        '<td class="num">' + U.esc(String(row.seq)) + '</td>' +
        '<td class="num">' + U.esc(U.fmtAV(row.av)) + '</td>' +
        '<td><span class="tag">' + U.esc(row.actor) + '</span></td>' +
        '<td class="' + U.className(kind) + '">' + U.esc(row.action) + '</td>' +
        '<td class="desc">' + desc + '</td>' +
        '<td class="dmg" title="' + U.esc(hitsTitle(row)) + '">' + U.esc(U.fmtDamage(row.damage)) +
        (row.hits.length > 1 ? '<span class="hits">×' + row.hits.length + '</span>' : '') + '</td>' +
        '</tr>';
    }).join("");
    if (!rows.length) body = '<tr><td colspan="6" class="muted" style="padding:16px;text-align:center">该筛选条件下没有行动记录。</td></tr>';
    var filter = '<select id="tlFilter" aria-label="按角色筛选">' + options + '</select>';
    return '<section class="card"><div class="cardhead"><h3>时间轴 <span class="muted">' + rows.length + ' / ' + r.timeline.length + ' 条</span></h3>' +
      '<div class="legend">' + filter + '</div></div>' +
      '<div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
  }

  function chartSVG(series, keys) {
    var W = 800, H = 300, pad = { l: 58, r: 20, t: 16, b: 36 };
    var avs = series.map(function (p) { return p.av; });
    var x0 = Math.min.apply(null, avs), x1 = Math.max.apply(null, avs);
    if (!(x1 > x0)) x1 = x0 + 1;
    var maxY = 1;
    keys.forEach(function (k) {
      series.forEach(function (p) { var v = U.num(p[k.k], 0); if (v > maxY) maxY = v; });
    });
    var pow = Math.pow(10, Math.floor(Math.log(maxY) / Math.LN10));
    maxY = Math.ceil(maxY / pow * 4) / 4 * pow;
    if (!isFinite(maxY) || maxY <= 0) maxY = 1;
    var sx = function (av) { return pad.l + (av - x0) / (x1 - x0) * (W - pad.l - pad.r); };
    var sy = function (v) { return H - pad.b - (v / maxY) * (H - pad.t - pad.b); };
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="资源曲线">';
    var i, j;
    for (i = 0; i <= 4; i++) {
      var gv = maxY * i / 4, gy = sy(gv);
      out += '<line class="grid" x1="' + pad.l + '" y1="' + gy.toFixed(1) + '" x2="' + (W - pad.r) + '" y2="' + gy.toFixed(1) + '"></line>';
      out += '<text class="axis" x="' + (pad.l - 8) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end">' + U.esc(fmtAxis(gv)) + '</text>';
    }
    for (j = 0; j <= 5; j++) {
      var xv = x0 + (x1 - x0) * j / 5, gx = sx(xv);
      out += '<line class="grid" x1="' + gx.toFixed(1) + '" y1="' + pad.t + '" x2="' + gx.toFixed(1) + '" y2="' + (H - pad.b) + '"></line>';
      out += '<text class="axis" x="' + gx.toFixed(1) + '" y="' + (H - pad.b + 15) + '" text-anchor="middle">' + U.esc(fmtAxis(xv)) + '</text>';
    }
    out += '<line class="axisline" x1="' + pad.l + '" y1="' + (H - pad.b) + '" x2="' + (W - pad.r) + '" y2="' + (H - pad.b) + '"></line>';
    out += '<text class="axis" x="' + (W - pad.r) + '" y="' + (H - pad.b + 28) + '" text-anchor="end">行动值 AV</text>';
    keys.forEach(function (k) {
      var pts = series.map(function (p) { return sx(p.av).toFixed(1) + "," + sy(U.num(p[k.k], 0)).toFixed(1); }).join(" ");
      out += '<polyline class="line" points="' + pts + '" stroke="' + k.color + '"></polyline>';
      if (series.length <= 60) {
        series.forEach(function (p) {
          var v = U.num(p[k.k], 0);
          out += '<circle class="dot" cx="' + sx(p.av).toFixed(1) + '" cy="' + sy(v).toFixed(1) + '" r="2.4" fill="' + k.color + '">' +
            '<title>' + U.esc(k.label + " @" + U.fmtAV(p.av) + " AV = " + (Math.round(v * 100) / 100)) + '</title></circle>';
        });
      }
    });
    out += '</svg>';
    return out;
  }

  function chartHTML(r) {
    var series = r.resources.series;
    if (series.length < 2) {
      return '<section class="card"><div class="cardhead"><h3>资源曲线</h3></div><div class="cardbody muted">资源采样点不足，无法绘制曲线。</div></section>';
    }
    var avail = CHART_KEYS.filter(function (k) {
      return series.some(function (p) { return typeof p[k.k] === "number" && isFinite(p[k.k]); });
    });
    var visible = avail.filter(function (k) { return !UI.state.chartHidden[k.k]; });
    var last = series[series.length - 1];
    var legend = avail.map(function (k) {
      var off = UI.state.chartHidden[k.k] ? " off" : "";
      return '<button class="lg' + off + '" data-legend="' + k.k + '" title="点击显示 / 隐藏该曲线"><i style="background:' + k.color + '"></i>' +
        U.esc(k.label) + '<b>' + U.esc(String(Math.round(U.num(last[k.k], 0) * 100) / 100)) + '</b></button>';
    }).join("");
    return '<section class="card"><div class="cardhead"><h3>资源曲线 <span class="muted">' + series.length + ' 个采样点</span></h3>' +
      '<div class="legend">' + legend + '</div></div><div class="cardbody">' +
      (visible.length ? chartSVG(series, visible) : '<p class="muted">全部曲线已隐藏，点击图例恢复。</p>') + '</div></section>';
  }

  function notesHTML(r) {
    var out = "";
    if (r.warnings.length) {
      out += '<section class="card warn"><div class="cardhead"><h3>⚠ 警告 <span class="muted">' + r.warnings.length + ' 条</span></h3></div><ul>' +
        r.warnings.map(function (w) { return '<li>' + U.esc(w) + '</li>'; }).join("") + '</ul></section>';
    }
    if (r.assumptions.length) {
      out += '<section class="card assume"><div class="cardhead"><h3>◆ 假设 <span class="muted">' + r.assumptions.length + ' 条</span></h3></div><ul>' +
        r.assumptions.map(function (a) { return '<li>' + U.esc(a) + '</li>'; }).join("") + '</ul></section>';
    }
    return out;
  }

  /* 结果区顶部：当前星魂配置一览（每角色一个徽标 + E0 / E0 / E3 / E6 摘要） */
  function eidolonStripHTML() {
    var chars = (UI.state.config && UI.state.config.characters) || {};
    var ids = Object.keys(chars), i;
    if (!ids.length) return "";
    var badges = "", plain = [];
    for (i = 0; i < ids.length; i++) {
      var id = ids[i], c = chars[id] || {};
      var info = UI.engine.characterInfo(id, UI.state.config);
      var e = info ? U.num(info.eidolon, 0) : U.num(c.eidolon, 0);
      var name = String(c.name || (info && info.name) || id);
      var cls = e >= 6 ? " max" : (e > 0 ? " on" : "");
      if (c.enabled === false) cls += " off";
      badges += '<span class="rs-badge' + cls + '" title="' +
        U.esc(name + " · 星魂 E" + e + (c.enabled === false ? "（未启用）" : " · 可在左侧角色卡片切换 0–6 魂")) + '">' +
        U.esc(name) + '<b>E' + e + '</b></span>';
      plain.push("E" + e);
    }
    return '<div class="eido-strip"><span class="rs-label">星魂</span>' + badges +
      '<span class="muted">' + U.esc(plain.join(" / ")) + '</span></div>';
  }

  /* v1.2.0 结果区顶部：光锥汇总条（如「光锥：银河城S1 / 花花世界S1 / 献给明日S1 / 阿哈S1」） */
  var LC_SHORT_NAMES = { "23053": "花花世界", "23055": "献给明日", "23057": "银河城", "23065": "阿哈" };
  function shortLcName(id, name) {
    if (LC_SHORT_NAMES[id]) return LC_SHORT_NAMES[id];
    var s = String(name || "").replace(/[「」【】《》\s]/g, "");
    s = s.replace(/^(欢迎来到|当第一声|使装备者)/, "");
    return s ? s.slice(0, 5) : "光锥";
  }
  /* 按引擎 CHARACTERS（队伍顺序：银狼 / 火花 / 真珠 / 阿哈）排列，缺失时退回配置顺序 */
  function stripOrder(ids) {
    var list = UI.engine.constant("CHARACTERS"), order = [], i, j;
    if (Array.isArray(list)) {
      for (i = 0; i < list.length; i++) {
        var cid = String((list[i] && list[i].id) !== undefined ? list[i].id : list[i]);
        if (ids.indexOf(cid) >= 0 && order.indexOf(cid) < 0) order.push(cid);
      }
    }
    for (j = 0; j < ids.length; j++) if (order.indexOf(ids[j]) < 0) order.push(ids[j]);
    return order;
  }
  /* v1.3.0 结果区顶部：遗器汇总条（如「遗器：魔法少女4+朋克洛德2 28词」） */
  var RELIC_SHORT = { "闪耀功勋的魔法少女": "魔法少女", "恶海逐波的船长": "船长", "盗匪荒漠的废土客": "废土客",
    "戏梦点星的伶人": "伶人", "应天涉远的卜者": "卜者", "骇域漫游的信使": "信使", "重循苦旅的司铎": "司铎",
    "零号关卡朋克洛德": "朋克洛德", "无主荒星茨冈尼亚": "茨冈尼亚", "天国@直播间": "天国",
    "奇想蕉乐园": "蕉乐园", "繁星竞技场": "繁星", "生命的翁瓦克": "翁瓦克",
    "沉陆海域露莎卡": "露莎卡", "折断的龙骨": "龙骨", "神的瞬息欢愉": "神瞬息" };
  function shortRelicName(name) {
    var s = String(name || "").replace(/[「」【】《》\s]/g, "");
    if (RELIC_SHORT[s]) return RELIC_SHORT[s];
    return s ? s.slice(0, 4) : "遗器";
  }
  function relicStripHTML() {
    var chars = (UI.state.config && UI.state.config.characters) || {};
    var ids = stripOrder(Object.keys(chars)), i;
    if (!ids.length) return "";
    var badges = "", plain = [];
    for (i = 0; i < ids.length; i++) {
      var id = ids[i], c = chars[id] || {};
      var on = !(U.isObj(c.relics) && c.relics.enabled === false);
      var info = UI.engine.characterInfo(id, UI.state.config);
      var rc = (info && U.isObj(info.relics)) ? info.relics.current : null;
      var rolls = rc ? U.num(rc.substatRolls, 0) : 0;
      var short = (on && rc) ? (shortRelicName(rc.set4Name) + "4+" + shortRelicName(rc.set2Name) + "2") : "未装备";
      var cls = (on && rc) ? (rolls >= 30 ? " max" : " on") : " off";
      if (c.enabled === false) cls += " off";
      var name = String(c.name || (info && info.name) || id);
      var title = name + " · " + ((on && rc)
        ? rc.set4Name + "（4 件套）+ " + rc.set2Name + "（2 件套）· 副词条 " + rolls + " 有效词条"
        : "未装备遗器（仅角色面板 + 光锥）");
      badges += '<span class="rs-badge' + cls + '" title="' + U.esc(title) + '">' +
        U.esc(name) + '<b>' + U.esc(short) + (on && rc ? " " + rolls + "词" : "") + '</b></span>';
      plain.push(short + (on && rc ? " " + rolls + "词" : ""));
    }
    return '<div class="eido-strip"><span class="rs-label">遗器</span>' + badges +
      '<span class="muted">' + U.esc(plain.join(" / ")) + '</span></div>';
  }

  function lightconeStripHTML() {
    var chars = (UI.state.config && UI.state.config.characters) || {};
    var ids = stripOrder(Object.keys(chars)), i;
    if (!ids.length) return "";
    var badges = "", plain = [];
    for (i = 0; i < ids.length; i++) {
      var id = ids[i], c = chars[id] || {};
      var conf = U.isObj(c.lightcone) ? c.lightcone : {};
      var info = UI.engine.characterInfo(id, UI.state.config);
      var lc = (info && U.isObj(info.lightcone)) ? info.lightcone : null;
      var cur = lc ? String(lc.current || "none") : "none";
      var on = conf.enabled !== false && cur !== "none";
      var opt = null, j;
      if (lc) for (j = 0; j < lc.options.length; j++) if (String(lc.options[j].id) === cur) opt = lc.options[j];
      var sp = on ? Math.max(1, Math.min(5, U.num(lc.currentSuperimpose, 1) || 1)) : 0;
      var short = on ? shortLcName(cur, opt && opt.name) + "S" + sp : "未装备";
      var cls = on ? (sp >= 5 ? " max" : " on") : " off";
      if (c.enabled === false) cls += " off";
      var title = (String(c.name || (info && info.name) || id)) + " · " +
        (on ? ((opt && opt.name) || "光锥") + (opt && opt.passive ? "（" + opt.passive + "）" : "") + " 叠影 S" + sp
            : "未装备光锥，面板不含光锥属性");
      badges += '<span class="rs-badge' + cls + '" title="' + U.esc(title) + '">' +
        U.esc(String(c.name || (info && info.name) || id)) + '<b>' + U.esc(short) + '</b></span>';
      plain.push(short);
    }
    return '<div class="eido-strip"><span class="rs-label">光锥</span>' + badges +
      '<span class="muted">' + U.esc(plain.join(" / ")) + '</span></div>';
  }

  UI.renderResults = function () {
    var host = U.el("results"), meta = U.el("resultMeta");
    if (!host) return;
    var errHTML = UI.state.error ? '<section class="card error"><div class="cardhead"><h3>模拟出错</h3></div><div class="cardbody">' +
      U.esc(UI.state.error) + '</div></section>' : "";
    var r = UI.state.result;
    if (!r) {
      host.innerHTML = errHTML + '<div class="card"><div class="empty">尚未运行模拟</div></div>';
      if (meta) meta.textContent = "";
      return;
    }
    host.innerHTML = errHTML + eidolonStripHTML() + lightconeStripHTML() + relicStripHTML() + kpiHTML(r) + shareHTML(r) + typeHTML(r) + timelineHTML(r) + chartHTML(r) + notesHTML(r);
    if (meta) meta.textContent = "引擎 v" + r.engineVersion + " · " + r.timeline.length + " 条行动 · " + r.resources.series.length + " 个资源采样点";
  };

  UI.onResultsClick = function (ev) {
    var el = ev.target;
    if (!el || !el.closest) return;
    var th = el.closest("th[data-sort]");
    if (th) {
      var key = th.getAttribute("data-sort");
      if (UI.state.sort.key === key) UI.state.sort.dir = UI.state.sort.dir === "asc" ? "desc" : "asc";
      else { UI.state.sort.key = key; UI.state.sort.dir = key === "damage" || key === "av" ? "desc" : "asc"; }
      UI.renderResults();
      return;
    }
    var lg = el.closest("[data-legend]");
    if (lg) {
      var k = lg.getAttribute("data-legend");
      UI.state.chartHidden[k] = !UI.state.chartHidden[k];
      UI.renderResults();
    }
  };

  UI.onResultsChange = function (ev) {
    var el = ev.target;
    if (el && el.id === "tlFilter") {
      UI.state.filter = el.value;
      UI.renderResults();
    }
  };

  UI.bindResults = function () {
    var host = U.el("results");
    if (!host) return;
    host.addEventListener("click", UI.onResultsClick);
    host.addEventListener("change", UI.onResultsChange);
  };
})(window.HSRUI = window.HSRUI || {});
</script>

<script>
/* =====================================================================
   模块 4：工具条事件绑定 + 启动
   ===================================================================== */
(function (UI) {
  "use strict";
  var U = UI.util;

  function bindToolbar() {
    U.el("btnRun").addEventListener("click", function () { UI.run(); });
    U.el("btnReset").addEventListener("click", function () {
      UI.state.config = UI.engine.defaultConfig();
      UI.applySchemaDefaults();
      UI.state.error = "";
      UI.renderParams();
      UI.toast("已重置为默认配置");
      UI.run();
    });
    U.el("btnExport").addEventListener("click", function () {
      var text = JSON.stringify(UI.state.config, null, 2);
      UI.showJson("配置 JSON（可复制 / 编辑后点「应用」）", text);
      UI.download("hsr4-config.json", text);
    });
    U.el("btnImport").addEventListener("click", function () {
      UI.showJson("粘贴配置 JSON 后点「应用」（非法 JSON 不会影响当前状态）", "");
      var area = U.el("jsonArea");
      if (area) area.focus();
    });
    U.el("btnCopyResult").addEventListener("click", function () {
      if (!UI.state.result) { UI.toast("尚无模拟结果"); return; }
      UI.copyText(JSON.stringify(UI.state.result, null, 2), "结果 JSON 已复制");
    });
    U.el("tglSliders").addEventListener("change", function (ev) {
      UI.state.showSliders = !!ev.target.checked;
      var host = U.el("params");
      if (host) host.classList.toggle("hide-sliders", !UI.state.showSliders);
    });
    U.el("btnExpandAll").addEventListener("click", function () {
      ((UI.state.schema || {}).groups || []).forEach(function (g) { UI.state.openGroups[g.id] = true; });
      UI.renderParams();
    });
    U.el("btnCollapseAll").addEventListener("click", function () {
      ((UI.state.schema || {}).groups || []).forEach(function (g) { UI.state.openGroups[g.id] = false; });
      UI.renderParams();
    });

    U.el("btnJsonApply").addEventListener("click", function () {
      var area = U.el("jsonArea");
      var text = area ? String(area.value || "").trim() : "";
      if (!text) { UI.showJsonError("请先粘贴 JSON 内容"); return; }
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (e) {
        UI.showJsonError("JSON 解析失败：" + (e && e.message ? e.message : String(e)));
        return;
      }
      if (!U.isObj(parsed)) { UI.showJsonError("顶层必须是 JSON 对象"); return; }
      var base = UI.engine.defaultConfig();
      UI.state.config = UI.mergeDeep(base, parsed);
      UI.applySchemaDefaults();
      UI.state.error = "";
      UI.state.filter = "all";
      UI.renderParams();
      var err = U.el("jsonError");
      if (err) { err.hidden = true; err.textContent = ""; }
      UI.toast("已应用导入的配置");
      UI.run();
    });
    U.el("btnJsonCopy").addEventListener("click", function () {
      var area = U.el("jsonArea");
      UI.copyText(area ? String(area.value || "") : "", "文本框内容已复制");
    });
    U.el("btnJsonClose").addEventListener("click", function () {
      var panel = U.el("jsonPanel");
      if (panel) panel.hidden = true;
    });
  }

  UI.boot = function () {
    try {
      UI.state.schema = UI.engine.schema();
      UI.state.config = UI.engine.defaultConfig();
      UI.applySchemaDefaults();
      (UI.state.schema.groups || []).forEach(function (g, i) { UI.state.openGroups[g.id] = (i === 0); });

      var banner = U.el("previewBanner");
      if (banner && UI.engine.preview) banner.hidden = false;
      var chipV = U.el("chipVersion");
      if (chipV) {
        chipV.textContent = "引擎 v" + UI.engine.version; /* 版本号来自 HSR_ENGINE.ENGINE_VERSION */
        chipV.title = "ENGINE_VERSION = " + UI.engine.version + (UI.engine.preview ? "（未内联引擎，使用 FALLBACK_ENGINE）" : "");
      }
      var chipM = U.el("chipMode");
      if (chipM) {
        chipM.textContent = UI.engine.preview ? "预览引擎 FALLBACK_ENGINE" : "内联引擎";
        chipM.className = "chip" + (UI.engine.preview ? " busy" : " ok");
      }
      var host = U.el("params");
      if (host) host.classList.toggle("hide-sliders", !UI.state.showSliders);

      UI.renderParams();
      UI.bindParams();
      UI.bindResults();
      bindToolbar();
      UI.renderResults();
      UI.run();
    } catch (e) {
      UI.state.error = "初始化失败：" + (e && e.message ? e.message : String(e));
      UI.renderResults();
      UI.setStatus("初始化失败", "bad");
    }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", UI.boot);
  else UI.boot();
})(window.HSRUI = window.HSRUI || {});
</script>
</body>
</html>
