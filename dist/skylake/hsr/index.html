.sec{background:linear-gradient(180deg,rgba(25,32,48,.92),rgba(20,26,40,.92));border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}

.slot .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}

.fld{display:flex;flex-direction:column;gap:2px;min-width:0}

input[type=number],input[type=text],input[type=search],select,textarea{background:#0e1320;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(143,168,255,.15)}
input[type=number]{font-variant-numeric:tabular-nums}
input.ov{border-color:var(--gold)!important;color:var(--gold)}
select{cursor:pointer}
input[type=checkbox]{accent-color:#7d8cff;width:14px;height:14px;vertical-align:middle;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}

.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(135deg,#4f63c9,#7650c9);color:#fff}
.seg button:hover:not(.on){background:#1c2438;color:var(--text)}
.pickbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#0e1320;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;cursor:pointer}
.pickbtn:hover{border-color:var(--accent)}
.pickbtn .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:#222b40;color:var(--muted);border:1px solid var(--line2);white-space:nowrap;line-height:17px}
.tag.gold{color:var(--gold);border-color:#5a4a26;background:#2a2416}
.tag.ok{color:var(--ok);border-color:#265a44;background:#15261f}

.tbl td{padding:4px 6px;border-bottom:1px solid rgba(37,46,66,.6);vertical-align:middle}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:rgba(143,168,255,.07)}

.eff.off{opacity:.45}
.eff .src{font-size:11px;color:var(--dim)}
.eff .raw{font-size:11px;color:var(--muted);margin-top:1px}
.effbox{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:2px 6px;background:#0f1422}
.buff{display:grid;grid-template-columns:1.5fr .8fr 1fr .7fr 24px;gap:5px;margin-bottom:5px;align-items:center}

.card{background:linear-gradient(160deg,#1b2238,#141a2a);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}

.card.hero{grid-column:span 2;border-color:#34406a}
.card.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(140,134,245,.35),transparent 70%)}

.bar{height:16px;border-radius:8px;background:#0e1320;overflow:hidden;border:1px solid var(--line)}

.tok.A{background:#2a3450;color:#b5c3f0}.tok.E{background:#1f4636;color:#8fe8bd}.tok.Q{background:#4e3f18;color:#ffd97a}.tok.F{background:#3d2654;color:#dcb0ff}.tok.X{background:#4a2140;color:#ffa6d9}.tok.M{background:#173c4f;color:#8fdcff}.tok.O{background:#2d2d38;color:#cfcfe0}

.flex{display:flex;gap:8px;align-items:center}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #3a4870;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:5px}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
