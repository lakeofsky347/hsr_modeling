<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>/*__HSR_ENGINE__*/</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欢愉四人队 · 完美轴伤害模拟器</title>
<style>
:root{
  --bg:#080b12; --panel:#111828; --panel2:#0d1421; --line:#1e2a3f; --line2:#2a3a56;
  --text:#e6edf7; --dim:#8fa3c0; --dim2:#6a7d9c;
  --accent:#2fe0c8; --accent2:#7c8cff; --warn:#ffc857; --bad:#ff6b81; --good:#4ade80;
  --elation:#a78bfa; --normal:#38bdf8; --true:#fb7185;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 18% -12%,#16213a 0%,#080b12 62%) fixed,#080b12;
  color:var(--text);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:600}
button,input,select,textarea{font-family:inherit}
.muted{color:var(--dim2);font-weight:400;font-size:11px}
.banner{background:#3a2d05;border-bottom:1px solid #6b5209;color:var(--warn);padding:7px 16px;font-size:12px;display:flex;gap:8px;align-items:center}
.banner b{color:#ffe08a}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101827,#0a101b);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;
  background:linear-gradient(140deg,#2b3f6b,#152036);border:1px solid var(--line2);color:var(--accent);flex:0 0 auto}
.topbar h1{font-size:15px;letter-spacing:.3px}
.sub{margin:1px 0 0;color:var(--dim);font-size:11.5px}
.topmeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);background:#0e1626;color:var(--dim);white-space:nowrap}
.chip.ok{color:var(--good);border-color:#1d4630}
.chip.busy{color:var(--warn);border-color:#4a3c12}
.chip.bad{color:var(--bad);border-color:#4d2029}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:#0b1220}
.btn{cursor:pointer;border:1px solid var(--line2);background:#141d2f;color:var(--text);border-radius:8px;padding:5px 11px;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--accent);color:#fff;background:#18243a}
.btn.primary{background:linear-gradient(140deg,#1c6f6a,#123c46);border-color:#2b8f86;color:#d8fffa}
.btn.primary:hover{background:linear-gradient(140deg,#238a83,#164a56)}
.btn.tiny{padding:3px 8px;font-size:11px}
.spacer{flex:1}
.tgl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.toast{font-size:11.5px;color:var(--accent);border:1px solid #1d4a48;background:#0c2322;padding:3px 9px;border-radius:999px}
.jsonpanel{margin:10px 16px 0;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);overflow:hidden}
.jsonpanel-head{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#101a2b;border-bottom:1px solid var(--line);flex-wrap:wrap}
.jsonpanel-head strong{font-size:12px}
.err{color:var(--bad);font-size:11.5px;flex:1;min-width:120px}
.jsonpanel textarea{width:100%;min-height:190px;border:0;background:#080d16;color:#cfe4ff;padding:10px;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;outline:none}

/* ---------- 布局 ---------- */
.layout{display:grid;grid-template-columns:minmax(340px,406px) minmax(0,1fr);gap:14px;padding:14px 16px 40px;align-items:start}
@media (max-width:1199px){.layout{grid-template-columns:1fr}}
@media (min-width:1200px){.col{max-height:calc(100vh - 128px);overflow:auto;padding-right:2px}}
.colhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.colhead h2{font-size:13px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.colhead .mini{cursor:pointer;border:1px solid var(--line2);background:#111a2a;color:var(--dim);border-radius:6px;font-size:11px;padding:2px 7px;margin-left:5px}
.colhead .mini:hover{color:#fff;border-color:var(--accent)}

/* ---------- 参数卡片 ---------- */
.card{border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,#111a2b,#0d1522);margin-bottom:11px;overflow:hidden}
details.card>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#101a2b;border-bottom:1px solid transparent}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{border-bottom-color:var(--line)}
details.card>summary:hover{background:#13203a}
.gtitle{font-size:12.5px;display:flex;align-items:center;gap:7px}
.gtitle:before{content:"▸";color:var(--accent);font-size:11px;transition:.15s}
details[open] .gtitle:before{transform:rotate(90deg)}
.gmeta{font-size:11px;color:var(--dim2);white-space:nowrap}
.gdesc{margin:0;padding:8px 12px 0;color:var(--dim2);font-size:11px}
.group-body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:9px}

.field{border-top:1px dashed #17233a;padding-top:8px}
.field:first-child{border-top:0;padding-top:2px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.flabel{font-size:12px;color:#c8d6ea;border-bottom:1px dotted #2b3b58;cursor:help}
.fval{font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.fval .unit{color:var(--dim2);font-style:normal;margin-left:2px;font-size:10.5px}
.fctl{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:center;margin-top:5px}
.field.no-slider .fctl{grid-template-columns:1fr}
.hide-sliders .slider{display:none}
.hide-sliders .fctl{grid-template-columns:1fr}
.fhelp{margin-top:4px;font-size:10.5px;color:var(--dim2);line-height:1.45}
input[type=number],input[type=text],select{width:100%;background:#0a111d;border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:4px 7px;font-size:12px;outline:none;font-variant-numeric:tabular-nums}
input[type=number]:focus,input[type=text]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px #2fe0c81f}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,#2b8f86,#20304a)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;background:#2fe0c8;border:2px solid #0a111d;box-shadow:0 0 6px #2fe0c880}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:#20304a}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:2px solid #0a111d;border-radius:50%;background:#2fe0c8}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{display:none}
.switch .track{width:38px;height:20px;border-radius:999px;background:#1b2740;border:1px solid var(--line2);position:relative;transition:.18s}
.switch .thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#5d6f8d;transition:.18s}
.switch input:checked+.track{background:#123c3a;border-color:#2b8f86}
.switch input:checked+.track .thumb{left:20px;background:var(--accent);box-shadow:0 0 8px #2fe0c890}

/* ---------- 结果 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,#121c2e,#0c1320);padding:10px 12px}
.kpi .k-label{font-size:11px;color:var(--dim)}
.kpi .k-value{font-size:20px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:.2px}
.kpi .k-sub{font-size:10.5px;color:var(--dim2);margin-top:2px}
.kpi.accent .k-value{color:var(--accent)}
.kpi.violet .k-value{color:var(--elation)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:#101a2b;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardhead h3{font-size:12.5px}
.cardbody{padding:11px 12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:120px 1fr 62px 104px;gap:9px;align-items:center}
@media (max-width:640px){.bar-row{grid-template-columns:92px 1fr 56px;}.bar-row .b-abs{display:none}}
.bar-name{font-size:12px;color:#cfdcef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;border-radius:7px;background:#0b1220;border:1px solid #1b2740;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#2b8f86,#7c8cff);transition:width .25s}
.bar-pct{font-size:12px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.bar-abs{font-size:11.5px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.type{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#0c1421}
.type .t-label{font-size:11.5px;display:flex;align-items:center;gap:6px}
.type .t-label i{width:8px;height:8px;border-radius:2px;display:inline-block}
.type .t-val{font-size:16px;margin-top:4px;font-variant-numeric:tabular-nums}
.type .t-share{font-size:10.5px;color:var(--dim2)}
.tablewrap{max-height:430px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;z-index:2;background:#101a2b;color:var(--dim);font-weight:500;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
thead th.no-sort{cursor:default}
thead th:hover{color:#fff}
thead th.num{text-align:right}
tbody td{padding:6px 9px;border-bottom:1px solid #131e30;vertical-align:top}
tbody tr:hover{background:#101a2b}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.dmg{font-variant-numeric:tabular-nums;text-align:right;color:#ffe9b0;white-space:nowrap}
td.desc{color:var(--dim);max-width:420px}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line2);background:#0d1727;white-space:nowrap}
.k-elation{color:var(--elation)}.k-normal{color:var(--normal)}.k-true{color:var(--true)}
.hits{font-size:10px;color:var(--dim2);margin-left:5px}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.legend select{width:auto;min-width:132px;padding:3px 6px;font-size:11.5px}
.lg{cursor:pointer;display:inline-flex;align-items:center;gap:5px;background:#0d1727;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;color:var(--text);font-size:11px}
.lg i{width:9px;height:3px;border-radius:2px;display:inline-block}
.lg b{color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}
.lg.off{opacity:.4}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:#1b2740;stroke-width:1;stroke-dasharray:3 4}
.chart .axisline{stroke:#2a3a56;stroke-width:1}
.chart .axis{fill:#6a7d9c;font-size:10px}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:#0b1220;stroke-width:1}
.card.warn{border-color:#4a3c12}
.card.warn .cardhead{background:#241d08}
.card.warn li{color:#ffdf9a}
.card.assume{border-color:#1d3a4a}
.card.assume .cardhead{background:#0d2230}
.card.error{border-color:#4d2029}
.card.error .cardhead{background:#2a0f14}
.card ul{margin:0;padding:9px 12px 11px 28px;color:var(--dim);display:flex;flex-direction:column;gap:5px}
.empty{color:var(--dim2);text-align:center;padding:40px 12px}

/* ---------- 星魂 / 技能等级面板（v1.1.0） ---------- */
.subblock{margin-top:11px;border:1px solid #1b2740;border-radius:9px;background:#0b1322;overflow:hidden}
.subhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;background:#101c2e;border-bottom:1px solid #1b2740;flex-wrap:wrap}
.subhead h3{font-size:11.5px;color:#cfe0f5;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.subhead h3:before{content:"\2726";color:var(--accent2);font-size:11px}
.skill-block .subhead h3:before{content:"\25C8";color:var(--accent)}
.subbody{padding:8px 10px 10px}
.subhead .muted{font-size:10px}
.eido-pick{padding-top:0;border-top:0}
.eido-pick .fctl{grid-template-columns:1fr}
.eido-chip{display:inline-block;min-width:34px;text-align:center;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid #2b8f86;background:#0c2322;color:var(--accent);font-variant-numeric:tabular-nums}
.eido-chip.zero{border-color:var(--line2);background:#0e1626;color:var(--dim2)}
.eido-sum{margin:8px 0 2px;font-size:10.5px;color:var(--dim2)}
.eido-sum b{color:var(--accent);font-weight:600}
.eido-item{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;padding:7px 0}
.eido-item+.eido-item{border-top:1px dashed #17233a}
.eido-rank{height:20px;line-height:18px;text-align:center;border-radius:6px;font-size:11px;font-weight:600;
  border:1px solid var(--line2);background:#0d1727;color:var(--dim2);font-variant-numeric:tabular-nums}
.eido-item.unlocked .eido-rank{border-color:#2b8f86;background:linear-gradient(140deg,#12403c,#0d2a30);color:var(--accent);box-shadow:0 0 8px #2fe0c82e}
.eido-body{min-width:0}
.eido-top{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.eido-name{font-size:12px;color:#dbe7f7;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eido-item.locked .eido-name{color:var(--dim2);text-decoration:line-through;text-decoration-color:#3d4c66}
.eido-item.locked{opacity:.55}
.eido-type{font-size:10px;padding:0 6px;border-radius:999px;border:1px solid var(--line2);background:#0d1727;color:var(--dim);white-space:nowrap}
.eido-type.skill{border-color:#3a4a86;background:#141c33;color:#a9b6ff}
.eido-state{margin-left:auto;font-size:10px;color:var(--good);white-space:nowrap}
.eido-item.locked .eido-state{color:var(--dim2)}
.eido-eff{margin-top:3px;font-size:10.5px;color:var(--accent)}
.eido-text{margin-top:3px;font-size:10.5px;line-height:1.5;color:var(--dim)}
details.eido-desc{margin:0}
details.eido-desc summary{cursor:pointer;list-style:none;margin-top:3px;font-size:10.5px;color:var(--dim);display:flex;gap:5px;align-items:baseline}
details.eido-desc summary::-webkit-details-marker{display:none}
.eido-toggle{color:var(--accent2);border-bottom:1px dotted #46579c;flex:0 0 auto}
.eido-peek{color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
details.eido-desc[open] summary .eido-peek{display:none}
details.eido-desc[open]>summary .eido-toggle{color:var(--dim2);border-bottom-color:transparent}
.skill-table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:auto}
.skill-table thead th{position:static;background:transparent;color:var(--dim2);font-weight:500;font-size:10.5px;
  text-align:left;padding:2px 4px 5px;border-bottom:1px solid #1b2740;cursor:default;white-space:nowrap}
.skill-table thead th.num{text-align:right}
.skill-table tbody td{padding:5px 4px;border-bottom:1px solid #131e30;vertical-align:middle}
.skill-table tbody tr:last-child td{border-bottom:0}
.skill-table tbody tr:hover{background:#0e1727}
.skill-table td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sk-title{font-size:11.5px;color:#cfdcef;display:inline-flex;align-items:center;gap:5px}
.sk-slot{font-style:normal;font-size:9.5px;padding:0 5px;border-radius:999px;border:1px solid var(--line2);background:#0d1727;color:var(--dim2)}
.sk-subname{display:block;font-size:10px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:132px}
.sk-input{width:58px;padding:2px 5px;font-size:11.5px;text-align:right}
.sk-lv{color:var(--dim)}
.sk-arrow{color:var(--dim2);margin:0 3px}
.sk-now{color:var(--text);font-weight:600}
.sk-lv .sk-base{color:var(--dim2)}
.sk-lv.boosted .sk-now{color:var(--accent);text-shadow:0 0 8px #2fe0c855}
.sk-lv.boosted .sk-arrow{color:var(--accent)}
.sk-lv.boosted .sk-base{color:var(--warn)}
.sk-cap{color:var(--dim)}
.sk-cap i{font-style:normal;display:block;font-size:9.5px;color:var(--accent2)}
.sk-note{margin:7px 0 0;font-size:10px;line-height:1.5;color:var(--dim2)}
.sk-note b{color:var(--accent2);font-weight:600}
/* 结果区星魂汇总条 */
.eido-strip{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px;padding:6px 11px;
  border:1px solid var(--line);border-radius:10px;background:#0c1421;font-size:11px;color:var(--dim2)}
.eido-strip .rs-label{color:var(--dim);letter-spacing:.5px}
.rs-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);
  background:#0e1626;font-size:11px;color:#cfdcef}
.rs-badge b{color:var(--dim2);font-weight:600;font-variant-numeric:tabular-nums}
.rs-badge.on{border-color:#2b8f86;background:#0b2320;color:#d8fffa}
.rs-badge.on b{color:var(--accent)}
.rs-badge.max{border-color:#6b5ad6;background:#171436;color:#e8e2ff}
.rs-badge.max b{color:#b9a8ff}
.rs-badge.off{opacity:.55}

/* ---------- 专属光锥面板（v1.2.0） ---------- */
.lc-block .subhead h3:before{content:"\25C6";color:var(--warn)}
.lc-topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px dashed #17233a}
.lc-topline .field{border-top:0;padding-top:0;display:flex;align-items:center;gap:7px;margin:0;min-width:0}
.lc-topline .field .fctl{margin-top:0;grid-template-columns:1fr;gap:6px}
.lc-name{font-size:12.5px;font-weight:600;color:#dbe7f7;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-star{font-style:normal;font-size:10px;font-weight:600;line-height:15px;padding:0 6px;border-radius:999px;
  color:#ffd479;border:1px solid #6b5209;background:#2a2107;white-space:nowrap}
.lc-passive{font-size:10.5px;line-height:16px;padding:0 7px;border-radius:999px;white-space:nowrap;
  color:#b9a8ff;border:1px solid #3a4a86;background:#141c33}
.lc-sup{margin-left:auto}
.lc-suplabel{font-size:10.5px;color:var(--dim2);white-space:nowrap}
.lc-sup select{width:auto;min-width:76px;padding:2px 6px;font-size:11.5px}
.lc-chip{display:inline-block;min-width:38px;text-align:center;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid #2b8f86;background:#0c2322;color:var(--accent);font-variant-numeric:tabular-nums}
.lc-chip.zero{border-color:var(--line2);background:#0e1626;color:var(--dim2)}
details.lc-descbox{margin:7px 0 0}
details.lc-descbox summary{cursor:pointer;list-style:none;font-size:10.5px;color:var(--dim);display:flex;gap:6px;align-items:baseline}
details.lc-descbox summary::-webkit-details-marker{display:none}
.lc-toggle{color:var(--accent2);border-bottom:1px dotted #46579c;flex:0 0 auto}
.lc-peek{color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
details.lc-descbox[open] summary .lc-peek{display:none}
details.lc-descbox[open]>summary .lc-toggle{color:var(--dim2);border-bottom-color:transparent}
.lc-desc{margin-top:4px;font-size:10.5px;line-height:1.55;color:var(--dim)}
.lc-stats{margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--dim2)}
.lc-stats b{color:#cfe0f5;font-weight:600;font-variant-numeric:tabular-nums}
.lc-tag{font-size:10px;padding:0 6px;border-radius:999px;border:1px solid var(--line2);background:#0d1727;color:var(--dim2);white-space:nowrap}
.lc-bonus{margin:6px 0 0;font-size:10px;color:var(--accent2);line-height:1.5}
.lc-compare{margin-top:9px}
.lc-table{width:100%;border-collapse:collapse;font-size:11.5px}
.lc-table thead th{position:static;background:transparent;color:var(--dim2);font-weight:500;font-size:10.5px;text-align:left;
  padding:2px 4px 5px;border-bottom:1px solid #1b2740;cursor:default;white-space:nowrap}
.lc-table thead th.num{text-align:right}
.lc-table tbody td{padding:5px 4px;border-bottom:1px solid #131e30;vertical-align:middle;white-space:nowrap}
.lc-table tbody tr:last-child td{border-bottom:0}
.lc-table tbody tr:hover{background:#0e1727}
.lc-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.lc-arrow{color:var(--dim2);margin-right:4px}
.lc-base{color:var(--dim2)}
.lc-now{color:var(--text);font-weight:500}
.lc-now.up{color:var(--accent);font-weight:600;text-shadow:0 0 8px #2fe0c855}
.lc-delta{font-size:10px;color:var(--dim2)}
.lc-delta.up{color:var(--accent)}
.lc-empty{margin-top:9px;font-size:11px;color:var(--dim2);border:1px dashed #1b2740;border-radius:8px;padding:8px 10px;background:#0a1120}
.lc-block.off .lc-name,.lc-block.off .lc-star,.lc-block.off .lc-passive{opacity:.5}
.lc-block.off .lc-descbox,[data-lc-dynamic]>.lc-desc,.lc-block.off .lc-stats{opacity:.55}
/* 时间轴：hits[].sources 乘区来源小标签（v1.2.0） */
.tl-src{margin-top:4px}
.tl-src summary{cursor:pointer;list-style:none;font-size:10px;color:var(--accent2);display:inline-block}
.tl-src summary::-webkit-details-marker{display:none}
.src-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.src-tags .tag{font-size:10px;color:var(--dim)}
</style>

<body>
<div id="previewBanner" class="banner" hidden><b>⚠</b><span>当前为预览模式（未内联引擎）</span><span class="muted">页面使用文件内嵌的 FALLBACK_ENGINE 演示数据结构，数值不代表真实战斗结果。</span></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">☺</div>
    <div>
      <h1>欢愉四人队 · 完美轴伤害模拟器</h1>
      <p class="sub">银狼LV.999 / 火花 / 真珠 / 星神★阿哈</p>
    </div>
  </div>
  <div class="topmeta">
    <span class="chip" id="chipVersion">引擎 v—</span>
    <span class="chip" id="chipMode">—</span>
    <span class="chip" id="simStatus">就绪</span>
  </div>
</header>

<div class="toolbar">
  <button class="btn primary" id="btnRun">重新模拟</button>
  <button class="btn" id="btnReset">重置默认</button>
  <button class="btn" id="btnExport">导出配置 JSON</button>
  <button class="btn" id="btnImport">导入配置 JSON</button>
  <button class="btn" id="btnCopyResult">复制结果 JSON</button>
  <label class="tgl"><input type="checkbox" id="tglSliders" checked> 滑块</label>
  <span class="spacer"></span>
  <span class="toast" id="toast" hidden></span>
</div>

<div class="jsonpanel" id="jsonPanel" hidden>
  <div class="jsonpanel-head">
    <strong id="jsonTitle">配置 JSON</strong>
    <span class="err" id="jsonError" hidden></span>
    <button class="btn tiny" id="btnJsonApply">应用</button>
    <button class="btn tiny" id="btnJsonCopy">复制</button>
    <button class="btn tiny" id="btnJsonClose">关闭</button>
  </div>
  <textarea id="jsonArea" spellcheck="false" placeholder="在此粘贴配置 JSON 后点击「应用」…"></textarea>
</div>

<main class="layout">
  <section class="col params-col">
    <div class="colhead">
      <h2>参数</h2>
      <div>
        <button class="mini" id="btnExpandAll">展开全部</button>
        <button class="mini" id="btnCollapseAll">收起全部</button>
      </div>
    </div>
    <div id="params"></div>
  </section>
  <section class="col results-col">
    <div class="colhead"><h2>结果</h2><div class="muted" id="resultMeta"></div></div>
    <div id="results"></div>
  </section>
</main>

<script>
/* =====================================================================

   仅用于「未内联真实引擎」时预览界面（结构严格遵循 ENGINE_API.md v1）
   ===================================================================== */
var FALLBACK_ENGINE = (function () {
  "use strict";
  var VERSION = "1.2.0-fallback";

  var CHARS = [
    { id: "1506", name: "银狼LV.999", atk: 388.1, def: 654.9, spd: 110, critRate: 0.05, critDmg: 0.5, elationDegree: 0.10 },

  ];
  var ROT = {
    "1506": [
      { path: "rotation.mode", label: "循环策略", type: "select", default: "perfect", help: "完美轴：保证 60 隐藏分准时开大",

        options: [{ value: "perfect", label: "完美轴（推荐）" }, { value: "conservative", label: "保守轴" }] },
      { path: "rotation.trapStacks", label: "互动陷阱层数", type: "number", min: 0, max: 20, step: 1, default: 10, unit: "层", help: "每层使强化普攻 +25% / +12.5%" }
    ],

        options: [{ value: "perfect", label: "完美轴（推荐）" }, { value: "conservative", label: "保守轴" }] },

        options: [{ value: "perfect", label: "完美轴（推荐）" }, { value: "conservative", label: "保守轴" }] },
      { path: "rotation.ascend", label: "命途升格覆盖", type: "boolean", default: true, help: "持有【欢愉万相】时全队欢愉命途升格" }
    ]
  };

  /* ---- v1.1.0：星魂 / 技能等级（与 engine/sim.js 同结构；预览用静态数据） ---- */
  var EIDOLON_SKILL_BONUS = {
    "1506": { 3: { skill: 2, basic: 1, elationSkill: 1 }, 5: { ult: 2, talent: 2, elationSkill: 1 } },
    "1501": { 3: { skill: 2, basic: 1, elationSkill: 1 }, 5: { ult: 2, talent: 2, elationSkill: 1 } },
    "1503": { 3: { ult: 2, basic: 1, elationSkill: 1 }, 5: { skill: 2, talent: 2, elationSkill: 1 } },
    "1511": { 3: { ult: 2, basic: 1, elationSkill: 1 }, 5: { skill: 2, talent: 2, elationSkill: 1 } }
  };
  var SLOT_CAPS = { basic: 10, skill: 15, ult: 15, talent: 15, elationSkill: 15, innate: 2, maze: 1 };
  var SLOT_LABELS = { basic: "普攻", skill: "战技", ult: "终结技", talent: "天赋",
                      elationSkill: "欢愉技", innate: "固有行迹", maze: "秘技" };
  var BASE_CAPS = { basic: 6, skill: 10, ult: 10, talent: 10, elationSkill: 10 };
  var BASE_LEVEL_FIELDS = ["basic", "skill", "ult", "talent", "elationSkill"];
  var EIDOLON_NAMES = {
    "1506": ["以太编辑：星魂+1", "是机制，不是BUG", "只有15级？谁填的", "我来，我见，我..秒了", "平A即是大招", "我独自满级！"],
    "1501": ["#全网热搜：她是谁？", "#观众的眼睛是雪亮的", "#请点击：心跳超链接", "#硬控！顶级表情管理", "#世界破烂，小花缝补", "#锵锵，即将绝版的我"],
    "1503": ["珍珠，藏在海的留白处", "截取，顷刻破晓的光斑", "速写，惊涛悬停的刹那", "解译，唇角模糊的笑意", "透视，笔端星夜的肌理", "用一副躯壳，演算生命"],
    "1511": ["谁在太初噤声时笑场", "在祂的眼睛和你之间", "牌叠起，令悲喜轮回", "黑箱一个玩笑的命运", "台前幕后，是我非我", "因为神说：你就是欢愉"]
  };
  var PREVIEW_DESC = "预览模式（未内联真实引擎）：此处仅演示星魂面板结构，效果原文与数值以引擎数据为准，不代表真实战斗结果。";

  /* ---- v1.2.0：专属光锥（结构同 engine/lightconedata.js；预览用静态数据） ----
     levels[叠影-1] = 该叠影下的参数数组，与 desc 里的 #1 #2 ... 一一对应 */
  var LIGHTCONES = {
    "23053": { name: "花花世界迷人眼", passive: "瞩目", rarity: 5, path: "Elation",
      desc: "使装备者的暴击伤害提高#1[i]%。装备者在场时，队伍中每有1名「欢愉」命途的角色，战技点上限提高#2[i]点，最多提高#3[i]点；装备者每消耗1个战技点使自身造成的欢愉伤害无视敌方目标#6[f1]%的防御力，最多叠加#5[i]层，若在同一回合内消耗大于等于#7[i]个战技点则使装备者获得【推流】。装备者持有【推流】时，我方全体欢愉度提高#4[i]%。同类光锥效果无法叠加。",
      levels: [[0.48, 1, 3, 0.2, 4, 0.05, 4], [0.56, 1, 3, 0.24, 4, 0.06, 4], [0.64, 1, 3, 0.28, 4, 0.07, 4],
               [0.72, 1, 3, 0.32, 4, 0.08, 4], [0.8, 1, 3, 0.36, 4, 0.09, 4]],
      stats: { hp: 1058.4, atk: 582.1, def: 463.1 } },
    "23055": { name: "献给明日的色彩", passive: "挥墨", rarity: 5, path: "Elation",
      desc: "使装备者的防御力提高#1[i]%。装备者对我方全体施放欢愉技时，使敌方全体受到的伤害提高#4[i]%，持续#3[i]回合，为装备者固定恢复#2[i]点能量，并为我方全体回复等同于装备者防御力#5[i]%的生命值。",
      levels: [[0.48, 10, 3, 0.22, 0.1], [0.6, 10, 3, 0.275, 0.125], [0.72, 10, 3, 0.33, 0.15],
               [0.84, 10, 3, 0.385, 0.175], [0.96, 10, 3, 0.44, 0.2]],
      stats: { hp: 1058.4, atk: 476.3, def: 595.3 } },
    "23057": { name: "欢迎来到银河城", passive: "稳赢", rarity: 5, path: "Elation",
      desc: "使装备者的速度提高#1[i]%，造成的欢愉伤害无视目标#2[i]%的防御力。当装备者对自身单体施放终结技时，获得#3[i]点【笑点】。该效果最多触发1次，施放#4[i]次普攻后重置可触发次数。",
      levels: [[0.18, 0.2, 20, 3], [0.21, 0.24, 25, 3], [0.24, 0.28, 30, 3], [0.27, 0.32, 35, 3], [0.3, 0.36, 40, 3]],
      stats: { hp: 1164.2, atk: 476.3, def: 529.2 } },
    "23065": { name: "当第一声「阿哈」响起", passive: "即兴巡演", rarity: 5, path: "Elation",
      desc: "使装备者的基础速度提高#1[i]点。对我方其他单体施放战技时，获得#2[i]个笑点，该效果每#3[i]回合最多触发1次，随后使我方全体在本场战斗中造成伤害时无视敌方目标#4[i]%的防御力，该效果无法叠加。",
      levels: [[12, 10, 2, 0.16], [14, 12, 2, 0.18], [16, 14, 2, 0.2], [18, 16, 2, 0.22], [20, 18, 2, 0.24]],
      stats: { hp: 952.6, atk: 582.1, def: 529.2 } }
  };
  var SIGNATURE_LIGHTCONE = { "1501": "23053", "1503": "23055", "1506": "23057", "1511": "23065" };

  function num(v, d) { var n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : d; }
  function r2(v) { return Math.round(num(v, 0) * 100) / 100; }
  function r3(v) { return Math.round(num(v, 0) * 1000) / 1000; }
  function meta(id) { for (var i = 0; i < CHARS.length; i++) { if (CHARS[i].id === id) return CHARS[i]; } return { id: id, name: id }; }
  function charOf(cfg, id) { return (cfg.characters && cfg.characters[id]) || {}; }
  function nameOf(id) { return meta(id).name; }

  /* ---- v1.2.0 光锥 API（结构遵循 ENGINE_API.md，供预览模式使用） ---- */
  function resolveLightcone(id, cc) {
    var conf = (cc && cc.lightcone) || {};
    var lcId = conf.id === undefined || conf.id === null ? SIGNATURE_LIGHTCONE[id] : String(conf.id);
    if (!lcId || lcId === "none" || conf.enabled === false) return null;
    var data = LIGHTCONES[lcId];
    if (!data) return null;
    var sp = Math.max(1, Math.min(5, num(conf.superimpose, 1)));
    return { id: lcId, name: data.name, passive: data.passive, desc: data.desc, rarity: data.rarity,
             path: data.path, superimpose: sp, params: data.levels[sp - 1] || data.levels[0] || [], stats: data.stats };
  }
  /* 固定属性先加、再乘百分比（与 engine/lightcones.js 一致）；返回加成明细 */
  function applyLightconeStats(stats, lc) {
    if (!lc) return null;
    var p = lc.params || [];
    var bonus = { hp: lc.stats.hp, atk: lc.stats.atk, def: lc.stats.def,
                  defPct: 0, critDmg: 0, spdFlat: 0, spdPct: 0, critRate: 0, elationDegree: 0 };
    if (lc.id === "23055") bonus.defPct = num(p[0], 0);
    if (lc.id === "23053") bonus.critDmg = num(p[0], 0);
    if (lc.id === "23057") bonus.spdPct = num(p[0], 0);
    if (lc.id === "23065") bonus.spdFlat = num(p[0], 0);
    stats.hp += bonus.hp; stats.atk += bonus.atk; stats.def += bonus.def;
    if (bonus.defPct) stats.def = stats.def * (1 + bonus.defPct);
    if (bonus.critDmg) stats.critDmg += bonus.critDmg;
    if (bonus.spdFlat) stats.spd += bonus.spdFlat;
    if (bonus.spdPct) stats.spd = stats.spd * (1 + bonus.spdPct);
    stats.spd = r2(stats.spd);
    stats.atk = Math.round(stats.atk * 10) / 10;
    stats.def = Math.round(stats.def * 10) / 10;
    stats.hp = Math.round(stats.hp * 10) / 10;
    bonus.totalSpd = stats.spd;
    return bonus;
  }
  function baseStatsOf(cfg, id) {
    var m = meta(id), st = charOf(cfg, id).stats || {};
    return { atk: num(st.atk, m.atk), def: num(st.def, m.def), hp: num(st.hp, 1047.8), spd: num(st.spd, m.spd),
             critRate: num(st.critRate, m.critRate), critDmg: num(st.critDmg, m.critDmg),
             elationDegree: num(st.elationDegree, m.elationDegree) };
  }
  function panelStatsOf(cfg, id) {
    var clone = baseStatsOf(cfg, id);
    applyLightconeStats(clone, resolveLightcone(id, charOf(cfg, id)));
    return clone;
  }
  function lightconeInfo(id, cfg) {
    cfg = cfg || defaultConfig();
    var cur = resolveLightcone(id, charOf(cfg, id)), sigId = SIGNATURE_LIGHTCONE[id], data = LIGHTCONES[sigId];
    var out = [];
    if (data) {
      out.push({ id: sigId, name: data.name, passive: data.passive, desc: data.desc, rarity: data.rarity,
                 stats: data.stats, signature: true, equipped: !!cur && cur.id === sigId,
                 superimpose: cur && cur.id === sigId ? cur.superimpose : 0,
                 params: cur && cur.id === sigId ? cur.params : null });
    }
    out.push({ id: "none", name: "不带光锥", passive: "", desc: "仅使用角色面板属性（可手动填写替代光锥的数值）",
               rarity: 0, stats: { hp: 0, atk: 0, def: 0 }, signature: false,
               equipped: !cur, superimpose: 0, params: null });
    return { current: cur ? cur.id : "none", currentSuperimpose: cur ? cur.superimpose : 0, options: out };
  }

  /* ---- v1.1.0 星魂 / 技能等级 API（结构遵循 ENGINE_API.md，供预览模式使用） ---- */
  function eidolonInfo(id, unlocked) {
    var names = EIDOLON_NAMES[id] || [], bonus = EIDOLON_SKILL_BONUS[id] || {}, out = [], r, slot;
    for (r = 1; r <= 6; r++) {
      var b = bonus[r] || null, parts = [];
      if (b) { for (slot in b) { if (Object.prototype.hasOwnProperty.call(b, slot)) parts.push(SLOT_LABELS[slot] + " 等级 +" + b[slot]); } }
      out.push({
        rank: r, name: names[r - 1] || ("星魂 " + r), desc: PREVIEW_DESC,
        type: b ? "skillLevel" : "mechanic", skillEffect: b ? parts.join("，") : null,
        unlocked: num(unlocked, 0) >= r
      });
    }
    return out;
  }
  function eidolonOptions(id) {
    var list = eidolonInfo(id, 0), opts = [{ value: 0, label: "0 魂（未解锁）" }], i;
    for (i = 0; i < list.length; i++) {
      var e = list[i];
      opts.push({ value: e.rank, label: e.rank + " 魂 · " + e.name + (e.skillEffect ? "（" + e.skillEffect + "）" : "（机制）") });
    }
    return opts;
  }
  function defaultSkillLevels(id) {
    var out = {}, slot;
    for (slot in BASE_CAPS) { if (Object.prototype.hasOwnProperty.call(BASE_CAPS, slot)) out[slot] = BASE_CAPS[slot]; }
    return out;
  }
  function effectiveSkillLevel(id, slot, base, eidolon) {
    var lv = num(base, BASE_CAPS[slot] || 10), bonus = EIDOLON_SKILL_BONUS[id] || {}, r;
    for (r = 1; r <= num(eidolon, 0); r++) { if (bonus[r] && bonus[r][slot]) lv += bonus[r][slot]; }
    return Math.max(1, Math.min(SLOT_CAPS[slot] || 15, lv));
  }
  function skillLevelInfo(unit, innateLv) {
    var slots = BASE_LEVEL_FIELDS, out = [], i;
    for (i = 0; i < slots.length; i++) {
      var slot = slots[i];
      var base = num(unit.cfg && unit.cfg.skillLevels ? unit.cfg.skillLevels[slot] : undefined, BASE_CAPS[slot]);
      out.push({ slot: slot, label: SLOT_LABELS[slot], level: effectiveSkillLevel(unit.id, slot, base, unit.eidolon),
                 base: base, cap: SLOT_CAPS[slot] || 15, skillIds: [], name: "" });
    }
    return out;
  }
  function characterInfo(id, cfg) {
    var useCfg = cfg || defaultConfig();
    var m = meta(id), cc = charOf(useCfg, id), eid = num(cc.eidolon, 0);
    var aha = (useCfg.characters && useCfg.characters["1511"]) || {};
    var innateLv = ((id === "1511" && eid >= 2) || num(aha.eidolon, 0) >= 2) ? 2 : 1;
    var base = baseStatsOf(useCfg, id), panel = baseStatsOf(useCfg, id);
    var lcBonus = applyLightconeStats(panel, resolveLightcone(id, cc));
    return {
      id: m.id, name: m.name, nameEn: m.nameEn || "", element: m.element || "",
      elementZh: m.elementZh || "", role: m.role || "",
      eidolon: eid, innateLevel: innateLv,
      eidolons: eidolonInfo(id, eid),
      skillLevels: skillLevelInfo({ id: id, cfg: cc, eidolon: eid }, innateLv),
      lightcone: lightconeInfo(id, useCfg),
      lightconeBonus: lcBonus,
      panelStats: panel, baseStats: base
    };
  }

  function charFields(prefix, c) {
    return [
      { path: prefix + "enabled", label: "启用该角色", type: "boolean", default: true, help: "关闭后不参与行动与伤害统计" },
      { path: prefix + "level", label: "角色等级", type: "number", min: 1, max: 80, step: 1, default: 80, unit: "级" },
      { path: prefix + "eidolon", label: "星魂解锁等级", type: "select", default: 0, options: eidolonOptions(c.id),
        help: "选择已解锁的星魂等级；3、5 魂提升技能等级，其余为机制质变" },
      { path: prefix + "lightcone.enabled", label: "装备专属光锥（" + ((LIGHTCONES[SIGNATURE_LIGHTCONE[c.id]] || {}).name || "专属光锥") + "）",
        type: "boolean", default: true, help: "光锥的满级固定属性与被动机制一并并入面板；关闭后仅使用角色面板属性（该字段由光锥区块渲染）" },
      { path: prefix + "lightcone.superimpose", label: "光锥叠影", type: "select", default: 1,
        options: [{ value: 1, label: "叠影 1" }, { value: 2, label: "叠影 2" }, { value: 3, label: "叠影 3" },
                  { value: 4, label: "叠影 4" }, { value: 5, label: "叠影 5" }],
        help: "叠影越高，光锥被动数值越高（该字段由光锥区块渲染）" },
      { path: prefix + "stats.atk", label: "攻击力", type: "number", min: 0, max: 4000, step: 0.1, default: c.atk, help: "影响常规伤害" },
      { path: prefix + "stats.def", label: "防御力", type: "number", min: 0, max: 4000, step: 0.1, default: c.def, help: "真珠的伤害与治疗按防御力结算" },
      { path: prefix + "stats.hp", label: "生命值", type: "number", min: 0, max: 20000, step: 0.1, default: 1047.8 },
      { path: prefix + "stats.spd", label: "速度", type: "number", min: 1, max: 300, step: 1, default: c.spd, unit: "速", help: "行动值间隔 = 10000 / 速度" },
      { path: prefix + "stats.critRate", label: "暴击率", type: "number", min: 0, max: 1, step: 0.01, default: c.critRate, help: "0-1 小数；界面同步显示百分比" },
      { path: prefix + "stats.critDmg", label: "暴击伤害", type: "number", min: 0, max: 5, step: 0.01, default: c.critDmg },
      { path: prefix + "stats.elationDegree", label: "欢愉度", type: "number", min: 0, max: 3, step: 0.01, default: c.elationDegree, help: "仅影响欢愉伤害，受增伤类效果影响" },
    ].concat(BASE_LEVEL_FIELDS.map(function (slot) {
      return { path: prefix + "skillLevels." + slot, label: SLOT_LABELS[slot] + "基础等级（未含星魂加成）", type: "number",
               min: 1, max: BASE_CAPS[slot], step: 1, default: BASE_CAPS[slot],
               help: "0 魂上限 " + BASE_CAPS[slot] + "，满星魂后上限 " + SLOT_CAPS[slot] };
    })).concat((ROT[c.id] || []).map(function (f) {
      var out = {}; for (var k in f) { if (Object.prototype.hasOwnProperty.call(f, k)) out[k] = f[k]; }
      out.path = prefix + f.path; return out;
    }));
  }

  function paramSchema() {
    var global = {
      id: "global", label: "全局 / 战斗环境", description: "敌人乘区、模拟时长、全队资源与欢愉伤害公式参数",
      fields: [
        { path: "duration.cycles", label: "模拟轮数", type: "number", min: 1, max: 12, step: 1, default: 3, unit: "轮", help: "总行动值 = 首轮 AV + (轮数-1) × 每轮 AV" },
        { path: "duration.firstCycleAV", label: "首轮行动值", type: "number", min: 50, max: 300, step: 5, default: 150, unit: "AV" },
        { path: "duration.avPerCycle", label: "每轮行动值", type: "number", min: 50, max: 200, step: 5, default: 100, unit: "AV" },
        { path: "enemy.level", label: "敌人等级", type: "number", min: 1, max: 95, step: 1, default: 80, unit: "级", help: "影响防御乘区" },
        { path: "enemy.defenseBase", label: "基础防御", type: "number", min: 0, max: 2000, step: 10, default: 200 },
        { path: "enemy.defensePerLevel", label: "每级防御", type: "number", min: 0, max: 40, step: 1, default: 10 },
        { path: "enemy.resBase", label: "基础抗性", type: "number", min: 0, max: 1, step: 0.05, default: 0.2, help: "无弱点时的抗性" },
        { path: "enemy.weakness", label: "存在弱点", type: "boolean", default: true, help: "有弱点 → 抗性按 0 计算" },
        { path: "enemy.resShred", label: "额外减抗", type: "number", min: 0, max: 1, step: 0.05, default: 0 },
        { path: "enemy.vulnerability", label: "易伤", type: "number", min: 0, max: 3, step: 0.05, default: 0, help: "受到的伤害提高" },
        { path: "enemy.toughnessDR", label: "未击破减伤", type: "number", min: 0, max: 1, step: 0.05, default: 0.1 },
        { path: "enemy.broken", label: "已击破韧性", type: "boolean", default: false, help: "开启后忽略未击破减伤" },
        { path: "enemy.targetCount", label: "敌人数量", type: "number", min: 1, max: 5, step: 1, default: 1, unit: "个", help: "影响均分类技能" },
        { path: "team.skillPoints.start", label: "初始战技点", type: "number", min: 0, max: 5, step: 1, default: 3, unit: "点" },
        { path: "team.skillPoints.max", label: "战技点上限", type: "number", min: 1, max: 5, step: 1, default: 5, unit: "点" },
        { path: "team.jokePoints.start", label: "初始笑点", type: "number", min: 0, max: 200, step: 1, default: 0, unit: "点" },
        { path: "team.ahaMoment.baseSpeed", label: "阿哈基础速度", type: "number", min: 1, max: 300, step: 1, default: 80, help: "决定阿哈时刻的间隔" },
        { path: "team.ahaMoment.speedFromAllies", label: "按队友提升阿哈速度", type: "boolean", default: true },
        { path: "options.alwaysCrit", label: "必定暴击", type: "boolean", default: true, help: "理想轴：欢愉伤害按暴击结算" },
        { path: "options.infiniteSkillPoints", label: "无限战技点", type: "boolean", default: false, help: "忽略战技点约束" },
        { path: "options.includeTrueDamage", label: "计入真实伤害", type: "boolean", default: true },
        { path: "options.elationBaseValue", label: "欢愉伤害基础值", type: "number", min: 0, max: 20000, step: 0.001, default: 7535.107, help: "80 级欢愉伤害基础值" },
        { path: "options.jokeCurveK", label: "笑点曲线 k", type: "number", min: 0, max: 50, step: 0.5, default: 5, help: "笑点乘区 = 1 + 笑点×k / (笑点+c)" },
        { path: "options.jokeCurveC", label: "笑点曲线 c", type: "number", min: 1, max: 2000, step: 1, default: 240 }
      ]
    };
    var groups = [global];
    CHARS.forEach(function (c) {
      groups.push({ id: c.id, label: c.name, description: "ID " + c.id + " · 等级 / 属性 / 技能等级 / 循环策略", fields: charFields("characters." + c.id + ".", c) });
    });
    return { version: VERSION, groups: groups };
  }

  function defaultConfig() {
    var characters = {};
    CHARS.forEach(function (c) {
      var rot = {};
      (ROT[c.id] || []).forEach(function (f) {
        var key = f.path.split(".")[1];
        rot[key] = f.default !== undefined ? f.default : (f.type === "boolean" ? false : "");
      });
      characters[c.id] = {
        enabled: true, name: c.name, level: 80, eidolon: 0,
        stats: { atk: c.atk, def: c.def, hp: 1047.8, spd: c.spd, critRate: c.critRate, critDmg: c.critDmg, elationDegree: c.elationDegree },
        skillLevels: defaultSkillLevels(c.id),
        lightcone: { enabled: true, id: SIGNATURE_LIGHTCONE[c.id] || "none", superimpose: 1 },
        rotation: rot
      };
    });
    return {
      meta: { version: "hsr-4.6.51", label: "银狼LV.999 + 火花 + 真珠 + 星神★阿哈" },
      duration: { cycles: 3, avPerCycle: 100, firstCycleAV: 150 },
      enemy: { level: 80, defenseBase: 200, defensePerLevel: 10, resBase: 0.2, weakness: true, resShred: 0, vulnerability: 0, toughnessDR: 0.1, broken: false, targetCount: 1 },
      team: { skillPoints: { start: 3, max: 5 }, jokePoints: { start: 0 }, ahaMoment: { baseSpeed: 80, speedFromAllies: true } },
      options: { alwaysCrit: true, infiniteSkillPoints: false, includeTrueDamage: true, elationBaseValue: 7535.107, jokeCurveK: 5, jokeCurveC: 240 },
      characters: characters
    };
  }

  function dmgOf(cfg, id, mult, kind, jokeNow) {
    var c = charOf(cfg, id), st = panelStatsOf(cfg, id), opt = cfg.options || {}, enemy = cfg.enemy || {};
    var lv = num(c.level, 80);
    var def = num(enemy.defenseBase, 200) + num(enemy.defensePerLevel, 10) * num(enemy.level, 80);
    var defMult = (lv + 20) / ((lv + 20) + def);
    var resMult = Math.max(0.1, 1 - ((enemy.weakness ? 0 : num(enemy.resBase, 0.2)) - num(enemy.resShred, 0)));
    var vulnMult = 1 + num(enemy.vulnerability, 0);
    var toughMult = enemy.broken ? 1 : (1 - num(enemy.toughnessDR, 0));
    var critMult = opt.alwaysCrit ? (1 + num(st.critDmg, 0.5)) : (1 + num(st.critRate, 0.05) * num(st.critDmg, 0.5));
    var core;
    if (kind === "elation") {
      var jm = 1 + (jokeNow * num(opt.jokeCurveK, 5)) / (Math.max(1, jokeNow) + num(opt.jokeCurveC, 240));
      core = num(opt.elationBaseValue, 7535.107) * mult * (1 + num(st.elationDegree, 0)) * jm;
    } else {
      core = num(st.atk, 1000) * mult;
    }
    return core * defMult * resMult * vulnMult * toughMult * critMult;
  }

  function simulate(cfg) {
    cfg = cfg || defaultConfig();
    var opt = cfg.options || {}, enemy = cfg.enemy || {}, dur = cfg.duration || {}, team = cfg.team || {};
    var ids = CHARS.filter(function (c) { return charOf(cfg, c.id).enabled !== false; }).map(function (c) { return c.id; });
    var totalAV = num(dur.firstCycleAV, 150) + (num(dur.cycles, 3) - 1) * num(dur.avPerCycle, 100);
    var spMax = num(team.skillPoints && team.skillPoints.max, 5);
    var infiniteSP = !!opt.infiniteSkillPoints;
    var joke = num(team.jokePoints && team.jokePoints.start, 0);
    var sp = num(team.skillPoints && team.skillPoints.start, 3);
    var hidden = 0, fervor = 0, goodDeed = 0;
    var timeline = [], total = 0, hitCount = 0;
    var byType = { elation: 0, normal: 0, true: 0 };
    var byChar = {};
    CHARS.forEach(function (c) { byChar[c.id] = 0; });
    var series = [{ av: 0, joke: joke, hiddenScore: hidden, fervor: fervor, sp: sp }];

    function push(av, id, action, description, hits) {
      var list = hits || [], dmg = 0, i;
      for (i = 0; i < list.length; i++) {
        dmg += num(list[i].damage, 0);
        var k = list[i].kind;
        if (byType[k] === undefined) byType[k] = 0;
        byType[k] += num(list[i].damage, 0);
      }
      total += dmg; hitCount += list.length;
      if (byChar[id] === undefined) byChar[id] = 0;
      byChar[id] += dmg;
      timeline.push({ seq: timeline.length + 1, av: r2(av), actorId: id, actor: nameOf(id), action: action, description: description, damage: r2(dmg), hits: list, note: "" });
      return dmg;
    }
    function hit(id, name, kind, mult, d) {
      return { skillId: id, skillName: name, kind: kind, multiplier: r3(mult), joke: r2(joke), elationDegree: 0, crit: !!opt.alwaysCrit, damage: r2(d) };
    }
    function gainJoke(n) { joke = Math.min(999, joke + n); }
    function spendSP(n) { if (!infiniteSP) sp = Math.max(0, sp - n); }
    function gainSP(n) { sp = infiniteSP ? spMax : Math.min(spMax, sp + n); }

    ids.forEach(function (id) {
      var rot = charOf(cfg, id).rotation || {};
      if (rot.useMaze === false) return;
      if (id === "1503") { goodDeed = Math.min(50, goodDeed + 20); push(0, id, "秘技", "凝润珠光，复刻真迹：+20 好活当赏 / +2 深度学习充能", []); }
      else if (id === "1506") { gainJoke(4); hidden = Math.min(240, hidden + 20); push(0, id, "秘技", "无敌玩家入场：+20 隐藏分 / +4 笑点", []); }
      else if (id === "1501") { gainJoke(3); push(0, id, "秘技", "提前布置互动陷阱：+3 笑点", []); }
      else { fervor = Math.min(8, fervor + 1); push(0, id, "秘技", "第一声「阿哈」：+1 愿力", []); }
    });

    var events = [];
    ids.forEach(function (id, idx) {
      var step = 10000 / Math.max(1, num(panelStatsOf(cfg, id).spd, 100)), av = step, guard = 0;
      while (av <= totalAV && guard < 300) { events.push({ av: av, id: id, order: idx }); av += step; guard++; }
    });
    var ahaSpeed = num(team.ahaMoment && team.ahaMoment.baseSpeed, 80) + (team.ahaMoment && team.ahaMoment.speedFromAllies ? Math.max(0, ids.length - 1) * 3 : 0);
    var ahaStep = 10000 / Math.max(1, ahaSpeed), ahaAV = ahaStep, g2 = 0;
    while (ahaAV <= totalAV && g2 < 120) { events.push({ av: ahaAV, id: "__aha__", order: -1 }); ahaAV += ahaStep; g2++; }
    events.sort(function (a, b) { return a.av - b.av || a.order - b.order; });

    events.forEach(function (ev) {
      var av = ev.av;
      if (ev.id === "__aha__") {
        var moment = 0;
        ids.forEach(function (id) {
          var rot = charOf(cfg, id).rotation || {};
          if (rot.mode === "conservative" && joke < 5) return;
          var mult = id === "1506" ? 0.675 : id === "1501" ? (0.625 + 20 * 0.3125) : id === "1503" ? 0.5 : 0.75;
          var d = dmgOf(cfg, id, mult, "elation", joke);
          moment += d;
          push(av, id, "欢愉技", "阿哈时刻：施放欢愉技（计入笑点 " + Math.round(joke) + "）", [hit(id + "90", "欢愉技", "elation", mult, d)]);
        });
        if (opt.includeTrueDamage && moment > 0) {
          push(av, "1511", "真实伤害", "按本次阿哈时刻总伤害 20% 结算真实伤害（不受任何效果影响）", [hit("151191", "真实伤害", "true", 0.2, moment * 0.2)]);
        }
        joke = 0;
        goodDeed = Math.min(75, goodDeed + 5);
      } else {
        var id = ev.id, c = charOf(cfg, id), st = panelStatsOf(cfg, id), rot = c.rotation || {};
        if (id === "1506") {
          if (hidden >= 60) {
            var d0 = dmgOf(cfg, id, 3.36, "elation", joke);
            push(av, id, "终结技", "消耗 60 隐藏分：殿堂级操作回放（欢愉伤害爆发）", [hit("1506ult", "终结技·殿堂级操作回放", "elation", 3.36, d0)]);
            hidden = Math.max(0, hidden - 60) + 15;
          }
          if (sp > 0 || infiniteSP) {
            var d1 = dmgOf(cfg, id, 2.0, "normal", joke);
            push(av, id, "战技", "200% 攻击力全体 + 5 笑点（等量转化隐藏分）", [hit("1506sk", "战技·崩坏级伤害演示", "normal", 2.0, d1)]);
            spendSP(1); gainJoke(5); hidden = Math.min(240, hidden + 5);
          } else if (rot.basicAttackFallback !== false) {
            var d2 = dmgOf(cfg, id, 3.36, "normal", joke);
            push(av, id, "强化普攻", "奖励关：狼尊时刻（336% 攻击力 / 100 段均分）", [hit("1506ba", "强化普攻·奖励关：狼尊时刻", "normal", 3.36, d2)]);
          }
        } else if (id === "1501") {
          var trap = num(rot.trapStacks, 10);
          var m1 = 1.4 + trap * 0.25, m2 = 0.5 + trap * 0.05;
          var d3 = dmgOf(cfg, id, m1, "elation", joke), d4 = dmgOf(cfg, id, m2, "elation", joke);
          push(av, id, "强化普攻", "互动陷阱 " + trap + " 层：强化普攻 + 天赋追加欢愉伤害", [
            hit("1501ba", "强化普攻·花花世界迷人眼", "elation", m1, d3),
            hit("1501tal", "天赋·互动陷阱追加", "elation", m2, d4)
          ]);
          if (sp > 0 || infiniteSP) { spendSP(1); } else { gainJoke(2); }
        } else if (id === "1503") {
          if (goodDeed < 50) {
            goodDeed = Math.min(50, goodDeed + 15);
            push(av, id, "战技", "珠光润泽：治疗 15% 防御力 + 300，+15 好活当赏（抵御值池）", []);
          } else {
            var m3 = 1.4, d5 = num(st.def, 700) * m3;
            push(av, id, "强化普攻", "140% 防御力全体 + 治疗 11.2% 防御力 + 224", [hit("1503ba", "强化普攻·渲染理性，解构欢愉", "normal", m3, d5)]);
            goodDeed = Math.max(0, goodDeed - 5);
          }
        } else {
          if (fervor >= 8) {
            var d6 = dmgOf(cfg, id, 2.4, "normal", joke), d7 = dmgOf(cfg, id, 0.72, "normal", joke) * 5;
            push(av, id, "终结技", "240% 全体 + 5×72%：赋予【欢愉万相】，全队欢愉命途升格", [
              hit("1511ult", "终结技·阿哈的狂欢", "normal", 2.4, d6),
              hit("1511ult2", "终结技追加 5 段", "normal", 3.6, d7)
            ]);
            fervor = 0;
          } else {
            fervor = Math.min(8, fervor + 1);
            var d8 = dmgOf(cfg, id, 0.625, "elation", joke);
            push(av, id, "战技", "令使：本回合 +25% 欢愉度，追加攻击 62.5% 全体", [hit("1511sk", "战技·令使宣告", "elation", 0.625, d8)]);
          }
        }
        gainSP(1);
      }
      series.push({ av: r2(av), joke: r2(joke), hiddenScore: r2(hidden), fervor: r2(fervor), sp: r2(sp) });
    });

    var byCharacter = ids.map(function (id) {
      return { id: id, name: nameOf(id), damage: r2(byChar[id]), share: total > 0 ? byChar[id] / total : 0 };
    });
    var warnings = [
      "当前为内置兜底引擎（FALLBACK_ENGINE）输出：倍率、资源节奏与乘区均为简化近似，仅用于验证界面结构，不代表真实战斗结果。",
      "未复现角色天赋、光锥、遗器套装与星魂的逐条效果，减防 / 易伤 / 抗性按线性乘区近似。"
    ];
    if (!ids.length) warnings.push("未启用任何角色：结果为空，请在左侧角色卡片中至少启用一名角色。");
    var assumptions = [
      "行动值间隔按 10000 / 速度 计算；第 1 轮 " + num(dur.firstCycleAV, 150) + " AV，其后每轮 " + num(dur.avPerCycle, 100) + " AV，模拟总线 " + totalAV + " AV。",
      "欢愉伤害按必定暴击结算（alwaysCrit = " + (opt.alwaysCrit ? "true" : "false") + "），欢愉度与笑点乘区共同作用于欢愉伤害基础值 " + num(opt.elationBaseValue, 7535.107) + "。",
      "阿哈行动后清空全部笑点；本次阿哈时刻总伤害的 20% 作为真实伤害在全体敌人间均分。",
      "敌人防御按 基础防御 + 每级防御 × 等级 计算，防御乘区 = (角色等级+20) / ((角色等级+20) + 敌人防御)。"
    ];
    return {
      ok: true, engineVersion: VERSION,
      summary: {
        totalDamage: r2(total), dps: r2(totalAV > 0 ? total / totalAV : 0),
        durationAV: totalAV, cycles: num(dur.cycles, 3), hitCount: hitCount, byCharacter: byCharacter,
        byType: [
          { type: "elation", label: "欢愉伤害", damage: r2(byType.elation) },
          { type: "normal", label: "常规伤害", damage: r2(byType.normal) },
          { type: "true", label: "真实伤害", damage: r2(byType.true) }
        ]
      },
      timeline: timeline,
      resources: { series: series, final: series[series.length - 1] },
      warnings: warnings, assumptions: assumptions
    };
  }

  return {
    ENGINE_VERSION: VERSION, paramSchema: paramSchema, defaultConfig: defaultConfig, simulate: simulate,
    EIDOLON_SKILL_BONUS: EIDOLON_SKILL_BONUS, SLOT_CAPS: SLOT_CAPS, SLOT_LABELS: SLOT_LABELS,
    defaultSkillLevels: defaultSkillLevels, eidolonInfo: eidolonInfo, skillLevelInfo: skillLevelInfo,
    characterInfo: characterInfo,
    CHARACTERS: CHARS, LIGHTCONES: LIGHTCONES, SIGNATURE_LIGHTCONE: SIGNATURE_LIGHTCONE,
    resolveLightcone: resolveLightcone, lightconeInfo: lightconeInfo, applyLightconeStats: applyLightconeStats
  };
})();
window.FALLBACK_ENGINE = FALLBACK_ENGINE;
</script>

<script>
/* =====================================================================

(function (UI) {
  "use strict";
