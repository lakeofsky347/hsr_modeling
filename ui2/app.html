<!-- 界面源码：ui2/app.html。打包：node scripts/v2/build.mjs → dist/hsr-sim-v2.html（内含引擎，离线可用） -->
<style>
:root{
  --bg:#0b0e17; --bg2:#10141f; --panel:#141a28; --panel2:#19202f; --line:#252e42; --line2:#303b53;
  --text:#e6e9f2; --muted:#98a2b9; --dim:#858fa6; --accent:#8fa8ff; --accent2:#c49bff; --gold:#f0c96a;
  --ok:#5fd4a0; --warn:#f0b35a; --bad:#f07a7a; --r:10px;
  --Physical:#cfd3dc; --Fire:#f36b45; --Ice:#62c9f2; --Thunder:#c77bf2; --Wind:#5fdca3; --Quantum:#8c86f5; --Imaginary:#f2d15a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 600px at 10% -10%,#1a2140 0%,transparent 60%),radial-gradient(900px 500px at 110% 0%,#2a1a40 0%,transparent 55%),var(--bg);color:var(--text);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3348;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
body{display:flex;flex-direction:column}
.top{min-height:56px;flex-wrap:wrap;row-gap:6px;padding-top:6px!important;padding-bottom:6px!important;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(12,15,25,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.logo{font-weight:700;font-size:16px;letter-spacing:.5px;background:linear-gradient(90deg,#b3c4ff,#d9b3ff 60%,#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.ver{color:var(--dim);font-size:11px;white-space:nowrap}
.grow{flex:1}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--accent);background:#1e2740}
.btn.pri{background:linear-gradient(135deg,#5b73e8,#8a5ce8);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:2px 8px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);min-width:150px;text-align:right;white-space:nowrap}
.status.run{color:var(--accent)} .status.err{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.app{display:grid;grid-template-columns:minmax(500px,600px) 1fr;flex:1;min-height:0}
.left,.right{overflow:auto;padding:14px 16px 40px}
.left{border-right:1px solid var(--line);background:rgba(10,13,22,.45)}
@media (max-width:1100px){body{display:block;height:auto}.app{grid-template-columns:1fr;height:auto}.left,.right{overflow:visible}.status{min-width:0}.ver{display:none}}
.sec{background:linear-gradient(180deg,rgba(25,32,48,.92),rgba(20,26,40,.92));border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sec>h2{margin:0 0 10px;font-size:13px;font-weight:650;color:#cdd5ea;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.sec>h2 .sub{color:var(--dim);font-weight:400;font-size:11.5px}
.sec>h2::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2))}
h3{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
h3 .grow{border-top:1px dashed var(--line)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;border:1px solid var(--line2);border-radius:12px;padding:9px 8px 8px;background:var(--panel);cursor:pointer;min-height:86px;transition:.15s;overflow:hidden}
.slot:hover{border-color:#44527a}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 4px 18px rgba(120,140,255,.18)}
.slot .ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#0b0e17;margin-bottom:5px}
.slot .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .meta{font-size:11px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.slot.empty{display:flex;align-items:center;justify-content:center;color:var(--dim);border-style:dashed;font-size:12px}
.slot .glow{position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;opacity:.18;filter:blur(8px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>label.lb,.lb{color:var(--muted);font-size:12px;min-width:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld>span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=number],input[type=text],input[type=search],select,textarea{background:#0e1320;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(143,168,255,.15)}
input[type=number]{font-variant-numeric:tabular-nums}
input.ov{border-color:var(--gold)!important;color:var(--gold)}
select{cursor:pointer}
input[type=checkbox]{accent-color:#7d8cff;width:14px;height:14px;vertical-align:middle;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 9px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(135deg,#4f63c9,#7650c9);color:#fff}
.seg button:hover:not(.on){background:#1c2438;color:var(--text)}
.pickbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#0e1320;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;cursor:pointer}
.pickbtn:hover{border-color:var(--accent)}
.pickbtn .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:#222b40;color:var(--muted);border:1px solid var(--line2);white-space:nowrap;line-height:17px}
.tag.gold{color:var(--gold);border-color:#5a4a26;background:#2a2416}
.tag.ok{color:var(--ok);border-color:#265a44;background:#15261f}
.tag.low{color:var(--warn);border-color:#5a4426;background:#2a2116}
.tag.acc{color:var(--accent);border-color:#34406a;background:#18203a}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line2);background:#121828;border-radius:14px;padding:2px 9px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.chip.on{color:#fff;border-color:var(--accent);background:#243060}
.chip:hover{border-color:#51608a}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#161c2b;z-index:1}
.tbl td{padding:4px 6px;border-bottom:1px solid rgba(37,46,66,.6);vertical-align:middle}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:rgba(143,168,255,.07)}
.tbl tbody tr.ev:nth-child(even) td{background:rgba(255,255,255,.018)}
.tbl tr.cyc td{background:linear-gradient(90deg,rgba(143,168,255,.16),rgba(143,168,255,.02));color:#c9d4ff;font-weight:600;font-size:11.5px;letter-spacing:.5px;padding:3px 8px;border-bottom:1px solid #34406a}
.tbl tr.enemy td{color:var(--dim)}
.tbl td.dmg{background-repeat:no-repeat;background-position:right center}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{stroke:#2a3348;stroke-width:1}
.chart .grid{stroke:#232b3e;stroke-width:1;stroke-dasharray:3 4}
.chart .cy{stroke:#3a4870;stroke-width:1;stroke-dasharray:2 3}
.chart text{fill:#7a849b;font-size:10.5px;font-family:inherit}
.chart .tip{position:absolute;pointer-events:none;background:rgba(16,20,32,.95);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:11.5px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;z-index:3}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .dim{color:var(--dim)} .gold{color:var(--gold)} .bad{color:var(--bad)} .okc{color:var(--ok)}
.eff{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:start;padding:5px 4px;border-bottom:1px solid rgba(37,46,66,.6)}
.eff.off{opacity:.45}
.eff .src{font-size:11px;color:var(--dim)}
.eff .raw{font-size:11px;color:var(--muted);margin-top:1px}
.effbox{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:2px 6px;background:#0f1422}
.buff{display:grid;grid-template-columns:1.5fr .8fr 1fr .7fr 24px;gap:5px;margin-bottom:5px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.card{background:linear-gradient(160deg,#1b2238,#141a2a);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.card .k{font-size:11.5px;color:var(--muted)}
.card .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:.3px}
.card.hero .v{font-size:28px;background:linear-gradient(90deg,#fff,#c9d4ff 50%,#e8c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .s{font-size:11px;color:var(--dim);margin-top:2px}
.card.hero{grid-column:span 2;border-color:#34406a}
.card.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(140,134,245,.35),transparent 70%)}
@media (max-width:1400px){.cards{grid-template-columns:repeat(2,1fr)}}
.bars .b{display:grid;grid-template-columns:120px 1fr 130px;gap:10px;align-items:center;margin:7px 0}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:16px;border-radius:8px;background:#0e1320;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:8px;transition:width .35s}
.stack{display:flex;height:22px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#0e1320}
.stack>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px}
.rot{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;margin:6px 0}
.tok{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;font-size:11px;font-weight:700;margin:0 3px 3px 0;font-family:ui-monospace,Menlo,monospace}
.tok.A{background:#2a3450;color:#b5c3f0}.tok.E{background:#1f4636;color:#8fe8bd}.tok.Q{background:#4e3f18;color:#ffd97a}.tok.F{background:#3d2654;color:#dcb0ff}.tok.X{background:#4a2140;color:#ffa6d9}.tok.M{background:#173c4f;color:#8fdcff}.tok.O{background:#2d2d38;color:#cfcfe0}
.tok.enh{box-shadow:inset 0 0 0 1px currentColor;background-image:linear-gradient(135deg,rgba(255,255,255,.10),transparent 60%)}
.tok.Q{box-shadow:0 0 8px rgba(240,201,106,.25)}.tok.sep{background:transparent;color:var(--dim);min-width:8px}
.tlwrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.hits td{background:#0f1422;font-size:11.5px;color:var(--muted)}
.warn{background:#2a2116;border:1px solid #5a4426;color:#f3cf98;border-radius:9px;padding:6px 10px;margin:5px 0;font-size:12px}
.errbox{background:#2a1616;border:1px solid #5a2626;color:#f3a8a8;border-radius:9px;padding:8px 12px;margin:5px 0;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
details.kit{border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#121828}
details.kit>summary{cursor:pointer;padding:8px 11px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.kit>summary::-webkit-details-marker{display:none}
details.kit>summary::before{content:"▸";color:var(--dim);transition:.15s}
details.kit[open]>summary::before{transform:rotate(90deg)}
.kitbody{padding:2px 12px 10px}
.ks{padding:7px 0;border-bottom:1px dashed var(--line)}
.ks:last-child{border-bottom:0}
.ks .t{font-weight:600;margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ks .d{color:#b9c1d6;font-size:12.3px;white-space:pre-wrap}
.ks.locked{opacity:.5}
.modal-bg{position:fixed;inset:0;background:rgba(4,6,12,.66);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{width:min(920px,94vw);max-height:86vh;display:flex;flex-direction:column;background:#141a28;border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh b{font-size:14px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal .mb{padding:12px 16px;overflow:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.pitem{border:1px solid var(--line2);border-radius:10px;padding:7px 9px;background:#10162400;cursor:pointer;display:flex;gap:8px;align-items:center;background:#111726}
.pitem:hover{border-color:var(--accent);background:#18203a}
.pitem.cur{border-color:var(--gold)}
.pitem .n{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .m{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .ava{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0b0e17}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px}
.empty-state{padding:50px 20px;text-align:center;color:var(--dim)}
.mini{font-size:11px}
.statrow td:first-child{color:#c9d0e2}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#1c2438;border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.flex{display:flex;gap:8px;align-items:center}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #3a4870;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20283e;border:1px solid var(--line2);padding:8px 16px;border-radius:10px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1400px){.twocol{grid-template-columns:1fr}}
.stale{opacity:.55;transition:opacity .2s}
</style>
</head>

        add(body, h('h3', null, '星魂', h('span', { class: 'grow' })));
        kit.eidolons.forEach(function (e) { add(body, h('div', { class: 'ks' + (e.rank > m.eidolon ? ' locked' : '') }, h('div', { class: 't' }, h('span', { class: 'tag' + (e.rank <= m.eidolon ? ' gold' : '') }, 'E' + e.rank), e.name), h('div', { class: 'd' }, e.desc || ''))); });
      }
      if ((kit.notes || []).length) {
        add(body, h('h3', null, '解析备注', h('span', { class: 'grow' })));
        kit.notes.forEach(function (n) { add(body, h('div', { class: 'warn' }, zhText(n))); });
      }
    }
    if (S.kitOpen[key]) fill();
    add(sec, det);
  });
  if (!S.slots.some(Boolean)) add(sec, h('div', { class: 'dim' }, '无角色'));
  return sec;
}

// ------------------------------------------------------------------ 启动
if (!restoreState()) loadConfig(null);
renderTop();
renderLeft();
initWorker();
setTimeout(function () { runNow(); }, 60);
window.__HSR2_UI__ = { S: S, runNow: runNow, loadConfig: loadConfig, buildConfig: buildConfig, renderLeft: renderLeft, statZh: statZh, zhText: zhText };
})();
</script>
